/* Liaisons des interactions de chaque onglet */
function bindDrawerTab(d,t,p){
  $$('[data-open]',p).forEach(b=>b.onclick=()=>openDocDrawer(b.dataset.open));
  const fb=$('#drFolder',p); if(fb) fb.onclick=()=>{ closeDrawer(); navigate('dossiers',{folder:d.folderId||null}); };
  const at=$('#drAttach',p); if(at) at.onclick=()=>docForm({id:d.id});
  if(t==='notes'){
    $('#drNotesSave',p).onclick=async()=>{ d.notes=$('#drNotes',p).value.trim(); d.tags=parseTags($('#drTags',p).value); await saveDoc(d,{action:'Notes / mots-clés modifiés'}); toast('Notes enregistrées','ok'); openDocDrawer(d.id,{keepTab:true,silent:true}); rerender(); };
    $$('[data-tagsearch]',p).forEach(b=>b.onclick=()=>{ closeDrawer(); navigate('recherche',{q:'tag:'+(/\s/.test(b.dataset.tagsearch)?'"'+b.dataset.tagsearch+'"':b.dataset.tagsearch)}); });
  }
  if(t==='contrat'){ const s=$('#drCStatus',p); if(s) s.onchange=async()=>{ d.contract.status=s.value; syncBusinessFields(d); await saveDoc(d,{action:'Statut du contrat',detail:CONTRACT_STATUS[s.value].label}); toast('Statut mis à jour','ok'); afterChange(); rerender(); }; }
  if(t==='facture'){
    const i=d.invoice;
    const add=async(amount,date,method,note)=>{ i.payments=i.payments||[]; i.payments.push({id:uid('pay'),date,amount,method,note}); await saveDoc(d,{action:'Règlement enregistré',detail:`${fmtMoney(amount,i.currency)} le ${fmtDate(date)}`}); toast('Règlement enregistré','ok'); afterChange(); rerender(); };
    const pa=$('#payAdd',p); if(pa) pa.onclick=async()=>{ const a=invoiceAmounts(i); const v=parseAmount($('#payAmt',p).value), dt=$('#payDate',p).value;
      if(v===null||v<=0){ $('#payAmt',p).focus(); toast('Montant de règlement invalide.','warn'); return; }
      if(v>a.balance+0.009){ $('#payAmt',p).focus(); toast(`Le règlement dépasse le solde restant (${fmtMoney(a.balance,i.currency)}).`,'warn'); return; }
      if(!isValidISO(dt)){ $('#payDate',p).focus(); toast('Date de règlement invalide.','warn'); return; }
      await add(v,dt,$('#payMethod',p).value,$('#payNote',p).value.trim()); };
    const pf=$('#payFull',p); if(pf) pf.onclick=async()=>{ const a=invoiceAmounts(i); await add(a.balance,$('#payDate',p).value||todayISO(),$('#payMethod',p).value,'Solde'); };
    $$('[data-delpay]',p).forEach(b=>b.onclick=()=>confirmDialog('Supprimer ce règlement ?',async()=>{ i.payments=i.payments.filter(x=>x.id!==b.dataset.delpay); await saveDoc(d,{action:'Règlement supprimé'}); afterChange(); rerender(); },{yes:'Supprimer'}));
    $$('[data-istat]',p).forEach(b=>b.onclick=async()=>{ i.manualStatus=b.dataset.istat||null; await saveDoc(d,{action:'Statut de la facture',detail:i.manualStatus?INVOICE_STATUS[i.manualStatus].label:'automatique'}); afterChange(); rerender(); });
  }
  if(t==='devis'){
    const q=d.quote; q.links=q.links||{contractId:null,orderId:null,invoiceId:null};
    const s=$('#drQStatus',p); if(s) s.onchange=async()=>{ q.status=s.value; await saveDoc(d,{action:'Statut du devis',detail:QUOTE_STATUS[s.value].label}); toast('Statut du devis mis à jour','ok'); afterChange(); rerender(); };
    $$('[data-unlink]',p).forEach(b=>b.onclick=async()=>{ const key=b.dataset.unlink; const t2=docById(q.links[key]); q.links[key]=null; if(t2&&t2.sourceQuoteId===d.id){ t2.sourceQuoteId=null; await saveDoc(t2,{action:'Lien avec le devis retiré',log:false}); } await saveDoc(d,{action:'Lien retiré'}); afterChange(); });
    $$('[data-create]',p).forEach(b=>b.onclick=()=>createFromQuote(d.id,b.dataset.create));
    $$('[data-link]',p).forEach(b=>b.onclick=()=>linkQuoteDialog(d.id,b.dataset.link,b.dataset.cat));
  }
}
/* Création d'un contrat / bon de commande / facture à partir d'un devis — sans doublon involontaire */
async function createFromQuote(qid,key){
  const qd=docById(qid); const q=qd.quote; q.links=q.links||{};
  const existing=q.links[key]&&docById(q.links[key]);
  if(existing&&!existing.trashed){ toast('Un document est déjà associé : ouverture de celui-ci.','info'); return openDocDrawer(existing.id); }
  const cat=key==='contractId'?'contrat':key==='orderId'?'commande':'facture';
  const other=liveDocs().find(x=>x.sourceQuoteId===qid&&x.category===cat);
  if(other){ q.links[key]=other.id; await saveDoc(qd,{action:'Lien rétabli',detail:other.title}); toast('Document déjà créé depuis ce devis : lien rétabli.','info'); return openDocDrawer(other.id); }
  if(quoteStatusKey(q)!=='accepte'&&quoteStatusKey(q)!=='commande'){
    return confirmDialog(`Le devis n'est pas au statut « Accepté ». Le marquer comme accepté et créer ${cat==='facture'?'la facture':cat==='contrat'?'le contrat':'le bon de commande'} ?`,()=>{ q.status='accepte'; return createFromQuote(qid,key); },{danger:false,yes:'Accepter et créer'});
  }
  const n=blankDoc({category:cat,title:`${cat==='facture'?'Facture':cat==='contrat'?'Contrat':'Bon de commande'} — ${q.client||qd.party||qd.title}`,folderId:S.settings.defaultFolders[cat]&&folderById(S.settings.defaultFolders[cat])?S.settings.defaultFolders[cat]:qd.folderId,
    tags:[...(qd.tags||[])],confidentiality:qd.confidentiality,status:'À compléter',sourceQuoteId:qid,party:q.client,reference:'',notes:`Créé à partir du devis ${q.number||qd.title}.`});
  ensureBusinessBlock(n);
  if(cat==='facture') Object.assign(n.invoice,{direction:'client',issuer:S.settings.company.name||'',recipient:q.client,issueDate:todayISO(),dueDate:addDays(todayISO(),30),ht:q.ht,tva:q.tva,ttc:invoiceAmounts(q).ttc,currency:q.currency});
  if(cat==='contrat') Object.assign(n.contract,{kind:'client',counterparty:q.client,status:'attente',amount:invoiceAmounts(q).ttc,currency:q.currency});
  syncBusinessFields(n);
  if(cat==='commande'){ n.party=q.client; n.issueDate=todayISO(); }
  n.history=[{at:Date.now(),action:'Créé depuis un devis',detail:qd.title}];
  q.links[key]=n.id; if(key==='orderId') q.status='commande';
  await saveDoc(n,{action:'',log:false}); await saveDoc(qd,{action:'Suite créée',detail:n.title});
  await logActivity('a créé depuis le devis',n.title,n.id);
  toast(`${n.title} créé (fiche à compléter avec le fichier original)`,'ok'); afterChange(); rerender();
}
function linkQuoteDialog(qid,key,cat){
  const qd=docById(qid);
  const cands=liveDocs().filter(x=>x.id!==qid&&x.category===cat).sort((a,b)=>b.createdAt-a.createdAt);
  if(!cands.length){ toast(`Aucun document de la catégorie « ${catLabel(cat)} » à associer.`,'info'); return; }
  openModal({title:`Associer : ${catLabel(cat)}`,body:`<div class="field"><label for="lkSel">Document existant</label><select class="sel" id="lkSel">${cands.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}${x.party?' — '+esc(x.party):''}${x.sourceQuoteId&&x.sourceQuoteId!==qid?' (déjà lié à un autre devis)':''}</option>`).join('')}</select></div>`,
    footer:`<button class="btn ghost" data-close>Annuler</button><button class="btn gold" id="lkOk">${svg('link')} Associer</button>`,
    onOpen:m=>{ $('#lkOk',m).onclick=async()=>{ const t=docById($('#lkSel',m).value); if(!t) return;
      qd.quote.links=qd.quote.links||{}; qd.quote.links[key]=t.id; if(key==='orderId'&&['accepte','envoye','brouillon'].includes(qd.quote.status)) qd.quote.status='commande';
      t.sourceQuoteId=qid; await saveDoc(t,{action:'Associé au devis',detail:qd.title}); await saveDoc(qd,{action:'Document associé',detail:t.title});
      closeModal(); toast('Documents associés','ok'); afterChange(); rerender(); }; }});
}

/* ============================================================
   MODULE 10 — DOSSIERS & SOUS-DOSSIERS (classement hiérarchique)
   ============================================================ */
async function createFolder(name,parentId=null){
  name=String(name).trim().slice(0,80);
  if(folderChildren(parentId).some(f=>norm(f.name)===norm(name))) throw new Error(`Un dossier « ${name} » existe déjà à cet emplacement.`);
  const f={id:uid('fld'),name,parentId:parentId||null,createdAt:Date.now(),updatedAt:Date.now()};
  await saveFolder(f); await logActivity('a créé le dossier',name,null); toast(`Dossier « ${name} » créé`,'ok'); return f;
}
function renameFolderDialog(id,done){ const f=folderById(id); promptDialog({title:'Renommer le dossier',label:'Nouveau nom',value:f.name,onSubmit:async v=>{
  if(folderChildren(f.parentId).some(x=>x.id!==id&&norm(x.name)===norm(v))) throw new Error('Un dossier porte déjà ce nom à cet emplacement.');
  const old=f.name; f.name=v.slice(0,80); await saveFolder(f); await logActivity('a renommé le dossier',`${old} → ${f.name}`); toast('Dossier renommé','ok'); if(done) done(); }}); }
function moveFolderDialog(id,done){
  const f=folderById(id); const excl=[id,...folderDescendants(id)];
  openModal({title:`Déplacer le dossier « ${f.name} »`,body:`<div class="field"><label for="mfSel">Nouveau dossier parent</label><select class="sel" id="mfSel">${folderOptions(f.parentId||'',{exclude:excl,rootLabel:'— Racine —'})}</select><span class="hint">Un dossier ne peut pas être déplacé dans l'un de ses propres sous-dossiers.</span></div>`,
    footer:`<button class="btn ghost" data-close>Annuler</button><button class="btn gold" id="mfOk">${svg('move')} Déplacer</button>`,
    onOpen:m=>{ $('#mfOk',m).onclick=async()=>{ const p=$('#mfSel',m).value||null;
      if(excl.includes(p)){ toast('Déplacement impossible (boucle).','dng'); return; }
      if(folderChildren(p).some(x=>x.id!==id&&norm(x.name)===norm(f.name))){ toast('Un dossier du même nom existe déjà à cet emplacement.','warn'); return; }
      f.parentId=p; await saveFolder(f); await logActivity('a déplacé le dossier',f.name); closeModal(); toast(`Dossier déplacé dans « ${folderPathLabel(p)} »`,'ok'); if(done) done(); }; }});
}
function deleteFolderDialog(id,done){
  const f=folderById(id); const sub=folderDescendants(id); const ids=[id,...sub];
  const docs=allDocs().filter(d=>ids.includes(d.folderId));
  confirmDialog(`Supprimer le dossier « ${f.name} »${sub.length?` et ses ${plural(sub.length,'sous-dossier')}`:''} ? ${docs.length?`Les ${plural(docs.length,'document')} qu'il contient ne seront PAS supprimés : ils seront déplacés dans « ${folderPathLabel(f.parentId)} ».`:'Le dossier est vide.'}`,async()=>{
    docs.forEach(d=>d.folderId=f.parentId||null);
    if(docs.length) await saveDocs(docs,{action:'Déplacé (dossier supprimé)',detail:f.name});
    await IDB.tx('folders','readwrite',st=>ids.forEach(x=>st.folders.delete(x)));
    ids.forEach(x=>S.folders.delete(x));
    Object.keys(S.settings.defaultFolders).forEach(k=>{ if(ids.includes(S.settings.defaultFolders[k])) delete S.settings.defaultFolders[k]; }); await saveSettings();
    await logActivity('a supprimé le dossier',f.name); toast('Dossier supprimé','warn'); if(done) done(f.parentId||null);
  },{yes:'Supprimer le dossier'});
}
/* Cible de dépôt (glisser des documents vers un dossier) */
function bindFolderDrop(el,fid,after){
  el.addEventListener('dragover',e=>{ if([...e.dataTransfer.types].includes('text/odm-docs')){ e.preventDefault(); el.classList.add('drop-over'); } });
  el.addEventListener('dragleave',()=>el.classList.remove('drop-over'));
  el.addEventListener('drop',async e=>{ el.classList.remove('drop-over'); const raw=e.dataTransfer.getData('text/odm-docs'); if(!raw) return; e.preventDefault(); e.stopPropagation();
    try{ const ids=JSON.parse(raw); await moveDocsTo(ids,fid); after(); }catch(err){ toast(storageErrorMessage(err),'dng'); } });
}

    +(allFolders().length?'':`<li class="muted small" style="padding:10px">Aucun dossier. Créez votre premier dossier pour organiser vos documents (ex. « Clients », « Fournisseurs », « Banque », « Assurances »).</li>`);

/* Export CSV des métadonnées (séparateur « ; » compatible Excel FR, BOM UTF-8) */
function exportCSV(docs,name){
  const cols=[['Nom',d=>d.title],['Catégorie',d=>catLabel(d.category)],['Type',d=>d.docType],['Référence',d=>d.reference],['Tiers',d=>d.party],['Date d\'émission',d=>d.issueDate],['Échéance',d=>d.dueDate],['Statut',d=>docStatus(d).label],
    ['Montant TTC',d=>{const a=docAmount(d);return a?String(a.v).replace('.',','):'';}],['Devise',d=>{const a=docAmount(d);return a?a.cur:'';}],['Solde',d=>d.invoice?String(invoiceAmounts(d.invoice).balance??'').replace('.',','):''],
    ['Dossier',d=>d.folderId?folderPathLabel(d.folderId):''],['Mots-clés',d=>(d.tags||[]).join(', ')],['Confidentialité',d=>confByKey(d.confidentiality).label],['Fichier',d=>d.fileName],['Taille (octets)',d=>d.fileSize||''],['Empreinte',d=>d.fileHash],
    ['Ajouté le',d=>new Date(d.createdAt).toISOString()],['Modifié le',d=>new Date(d.updatedAt).toISOString()],['Notes',d=>d.notes],['Démonstration',d=>d.demo?'oui':''],['Identifiant',d=>d.id]];
  const q=v=>{ v=String(v??''); if(/^[=+\-@\t\r]/.test(v)) v="'"+v; return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }; // protection contre l'injection de formules

/* Toutes les dates clés (calendrier) — y compris hors fenêtre de rappel */
function dueEvents(){
  const out=[]; const add=(d,date,label,cls)=>{ if(date) out.push({date,docId:d.id,title:d.title,label,cls}); };
  activeDocs().forEach(d=>{
    if(d.category==='contrat'&&d.contract){ const c=d.contract; const k=contractStatusKey(c); if(['actif','echu','attente'].includes(k)){ add(d,c.endDate,'Fin de contrat',k==='echu'?'dng':'mission'); add(d,c.renewalDate,'Renouvellement','mission'); const n=contractNotice(c); if(n) add(d,n.deadline,'Limite de préavis',n.days<0?'dng':'mission'); } }
    else if(d.category==='facture'&&d.invoice){ const k=invoiceStatusKey(d.invoice); if(['apayer','partielle','retard'].includes(k)) add(d,d.invoice.dueDate,'Échéance facture',k==='retard'?'dng':'reunion'); }
    else if(d.category==='devis'&&d.quote){ if(['envoye','brouillon'].includes(d.quote.status)) add(d,d.quote.validUntil,'Validité du devis',daysUntil(d.quote.validUntil)<0?'dng':'formation'); }
    else if(d.dueDate) add(d,d.dueDate,'Échéance',daysUntil(d.dueDate)<0?'dng':'conge');
  });
  return out;
}

/* ============================================================
   RECHERCHE DOCUMENTAIRE (métadonnées réellement enregistrées)
   Syntaxe : cat:facture  tiers:dupont  ref:F-2026  tag:urgent  statut:"en retard"
             type:kbis  avant:2026-06-30  après:2026-01-01  echeance:30  dans:archives|corbeille|tout
   Le contenu des PDF / Word / Excel n'est PAS indexé (seuls TXT, CSV, MD le sont).
   ============================================================ */
function frDateToISO(s){ const m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(s); return m?`${m[3]}-${pad2(m[2])}-${pad2(m[1])}`:s; }
function parseQuery(q){
  const out={text:[],f:{}}; const re=/([\p{L}]+):("([^"]*)"|(\S+))|"([^"]*)"|(\S+)/giu; let m;
  while((m=re.exec(q||''))){ if(m[1]){ const k=norm(m[1]); out.f[k]=m[3]!==undefined?m[3]:m[4]; } else out.text.push(frDateToISO(m[5]!==undefined?m[5]:m[6])); }
  return out;
}
function searchDocs(q,filters={}){
  const P=parseQuery(q); const F=Object.assign({},filters);
  const map={cat:'cat',categorie:'cat',tiers:'party',client:'party',fournisseur:'party',ref:'ref',reference:'ref',tag:'tag',motcle:'tag',statut:'status',type:'type',avant:'to','après':'from',apres:'from',echeance:'due',dans:'scope',conf:'conf'};
  Object.entries(P.f).forEach(([k,v])=>{ if(map[k]) F[map[k]]=v; else P.text.push(k+':'+v); });
  let arr=F.scope==='tout'?allDocs():F.scope==='corbeille'?allDocs().filter(d=>d.trashed):F.scope==='archives'?liveDocs().filter(d=>d.archived):F.scope==='actifs'?activeDocs():liveDocs();
  const has=(v,t)=>norm(v).includes(norm(t));
  if(F.cat){ const c=cats().find(x=>x.key===F.cat||has(x.label,F.cat)||has(x.key,F.cat)); arr=c?arr.filter(d=>d.category===c.key||(F.cat.length>2&&has(catLabel(d.category),F.cat))):[]; }
  if(F.party) arr=arr.filter(d=>has([d.party,d.invoice?.issuer,d.invoice?.recipient,d.contract?.counterparty,d.quote?.client].join(' '),F.party));
  if(F.ref) arr=arr.filter(d=>has([d.reference,d.invoice?.number,d.contract?.number,d.quote?.number].join(' '),F.ref));
  if(F.tag) arr=arr.filter(d=>(d.tags||[]).some(t=>has(t,F.tag)));
  if(F.status) arr=arr.filter(d=>has(docStatus(d).label,F.status));
  if(F.type) arr=arr.filter(d=>has(d.docType+' '+extOf(d.fileName),F.type));
  if(F.conf) arr=arr.filter(d=>d.confidentiality===F.conf);
  const dateOf=d=>d.issueDate||isoLocal(new Date(d.createdAt));
  if(F.from) arr=arr.filter(d=>dateOf(d)>=frDateToISO(F.from));
  if(F.to) arr=arr.filter(d=>dateOf(d)<=frDateToISO(F.to));
  if(F.due){ const n=parseInt(F.due,10); if(!isNaN(n)) arr=arr.filter(d=>d.dueDate&&daysUntil(d.dueDate)<=n&&daysUntil(d.dueDate)>=(n<0?-99999:0)); else arr=arr.filter(d=>d.dueDate&&d.dueDate<=frDateToISO(F.due)); }
  if(F.hasFile==='oui') arr=arr.filter(d=>d.fileId); if(F.hasFile==='non') arr=arr.filter(d=>!d.fileId);
  if(P.text.length){ const words=P.text.map(norm).filter(Boolean);
    arr=arr.filter(d=>{ const t=docSearchText(d)+' | '+norm(d.contentText||''); return words.every(w=>t.includes(w)); }); }
  return {results:arr,text:P.text.join(' '),filters:F};
}

/* ============================================================
   MODULE 13 — SAUVEGARDE, RESTAURATION & PORTABILITÉ
   Format d'archive documenté « ondea-docs-backup » v1 = ZIP standard :
     manifest.json            → description, version, compteurs, liste des fichiers + CRC-32 + SHA-256
     data/documents.json      → métadonnées de tous les documents
     data/folders.json        → dossiers
     data/settings.json       → paramètres de l'entreprise
     data/activity.json       → journal d'activité
     data/alerts.json         → état des alertes (traitées / ignorées)
     files/<idFichier>/<nom>  → FICHIERS ORIGINAUX, octet pour octet (non compressés)
     LISEZMOI.txt             → description lisible du format
   L'archive s'ouvre avec l'Explorateur Windows (clic droit > Extraire tout).
   ============================================================ */
const BACKUP_FORMAT='ondea-docs-backup', BACKUP_FORMAT_VERSION=1;
const ENC_MAGIC='ODMENC1';

/* ---------- Écriture ZIP (méthode « stockée », noms UTF-8) ---------- */
function dosDateTime(d=new Date()){ return {time:(d.getHours()<<11)|(d.getMinutes()<<5)|Math.floor(d.getSeconds()/2),date:((Math.max(1980,d.getFullYear())-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}; }
class ZipWriter{
  constructor(){ this.parts=[]; this.cd=[]; this.offset=0; this.count=0; this.enc=new TextEncoder(); }
  async add(name,data,{date=new Date(),onProg}={}){
    const blob=data instanceof Blob?data:new Blob([typeof data==='string'?this.enc.encode(data):data]);
    const size=blob.size; if(size>=0xFFFFFFFF||this.offset+size>=0xFFFFFFFF) throw new Error("L'archive dépasserait 4 Go : sauvegardez par sélection (plusieurs archives) ou archivez d'abord une partie des documents.");
    if(this.count>=65000) throw new Error('Trop de fichiers pour une seule archive (65 000 maximum).');
    const crc=await crc32Blob(blob,onProg); const nm=this.enc.encode(name); const {time,date:dd}=dosDateTime(date);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,time,true); h.setUint16(12,dd,true);
    h.setUint32(14,crc,true); h.setUint32(18,size,true); h.setUint32(22,size,true); h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    this.parts.push(h.buffer,nm,blob);
    this.cd.push({nm,crc,size,time,dd,off:this.offset});
    this.offset+=30+nm.length+size; this.count++;
    return crc;
  }
  finish(){
    const cdParts=[]; let cdSize=0;
    this.cd.forEach(e=>{ const c=new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,e.time,true); c.setUint16(14,e.dd,true);
      c.setUint32(16,e.crc,true); c.setUint32(20,e.size,true); c.setUint32(24,e.size,true); c.setUint16(28,e.nm.length,true); c.setUint16(30,0,true); c.setUint16(32,0,true);
      c.setUint16(34,0,true); c.setUint16(36,0,true); c.setUint32(38,0,true); c.setUint32(42,e.off,true);
      cdParts.push(c.buffer,e.nm); cdSize+=46+e.nm.length; });
    const eo=new DataView(new ArrayBuffer(22));
    eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true); eo.setUint16(8,this.count,true); eo.setUint16(10,this.count,true);
    eo.setUint32(12,cdSize,true); eo.setUint32(16,this.offset,true); eo.setUint16(20,0,true);
    return new Blob([...this.parts,...cdParts,eo.buffer],{type:'application/zip'});
  }
}
/* ---------- Lecture ZIP (sans charger toute l'archive en mémoire) ---------- */
async function readZip(file){
  const tailLen=Math.min(file.size,65557); const tail=new DataView(await file.slice(file.size-tailLen).arrayBuffer());
  let eocd=-1; for(let i=tailLen-22;i>=0;i--){ if(tail.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("Ce fichier n'est pas une archive ZIP valide (répertoire central introuvable).");
  const n=tail.getUint16(eocd+10,true), cdSize=tail.getUint32(eocd+12,true), cdOff=tail.getUint32(eocd+16,true);
  if(cdOff===0xFFFFFFFF||n===0xFFFF) throw new Error('Archive ZIP64 non prise en charge.');
  if(cdOff+cdSize>file.size) throw new Error('Archive ZIP tronquée ou endommagée.');
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()); const dec8=new TextDecoder('utf-8'), dec1=new TextDecoder('latin1');
  const entries=new Map(); let p=0;
  for(let k=0;k<n;k++){
    if(cd.getUint32(p,true)!==0x02014b50) throw new Error('Répertoire central ZIP endommagé.');
    const flags=cd.getUint16(p+8,true), method=cd.getUint16(p+10,true), crc=cd.getUint32(p+16,true), csize=cd.getUint32(p+20,true), usize=cd.getUint32(p+24,true);
    const nl=cd.getUint16(p+28,true), xl=cd.getUint16(p+30,true), cl=cd.getUint16(p+32,true), off=cd.getUint32(p+42,true);
    const nameBytes=new Uint8Array(cd.buffer,p+46,nl); const name=(flags&0x800?dec8:dec1).decode(nameBytes);
    entries.set(name,{name,method,crc,csize,usize,off,flags});
    p+=46+nl+xl+cl;
  }
  const dataStart=async e=>{ const h=new DataView(await file.slice(e.off,e.off+30).arrayBuffer()); if(h.getUint32(0,true)!==0x04034b50) throw new Error('En-tête local ZIP invalide pour '+e.name); return e.off+30+h.getUint16(26,true)+h.getUint16(28,true); };
  return {
    entries,
    has:n=>entries.has(n),
    async blob(name,type=''){ const e=entries.get(name); if(!e) throw new Error('Entrée absente de l\'archive : '+name); const s=await dataStart(e); const raw=file.slice(s,s+e.csize);
      if(e.method===0) return type?new Blob([raw],{type}):raw;
      if(e.method===8){ if(typeof DecompressionStream!=='function') throw new Error('Décompression non prise en charge par ce navigateur.'); const out=await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob(); return type?new Blob([out],{type}):out; }
      throw new Error('Méthode de compression ZIP non prise en charge ('+e.method+').'); },
    async text(name){ return (await this.blob(name)).text(); },
    async json(name){ const t=await this.text(name); try{ return JSON.parse(t); }catch(e){ throw new Error('Fichier JSON illisible dans l\'archive : '+name); } }
  };
}

/* ---------- Chiffrement optionnel des sauvegardes (Web Crypto : PBKDF2 + AES-GCM 256) ---------- */
async function deriveKey(password,salt,iter){ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
const b64=u=>btoa(String.fromCharCode(...u)); const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encryptBlob(blob,password){
  if(!crypto.subtle) throw new Error('Chiffrement indisponible dans ce contexte.');
  if(blob.size>1.5*1024*1024*1024) throw new Error('Archive trop volumineuse pour être chiffrée dans le navigateur (> 1,5 Go). Faites une sauvegarde non chiffrée et stockez-la sur un support chiffré (ex. BitLocker).');
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), iter=310000;
  const key=await deriveKey(password,salt,iter); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,await blob.arrayBuffer());
  const head=ENC_MAGIC+'\n'+JSON.stringify({alg:'AES-GCM-256',kdf:'PBKDF2-SHA256',iter,salt:b64(salt),iv:b64(iv),format:BACKUP_FORMAT})+'\n';
  return new Blob([head,ct],{type:'application/octet-stream'});
}
async function isEncrypted(file){ const t=await file.slice(0,ENC_MAGIC.length).text(); return t===ENC_MAGIC; }
async function decryptFile(file,password){
  const headTxt=await file.slice(0,4096).text(); const lines=headTxt.split('\n'); if(lines[0]!==ENC_MAGIC) throw new Error('Fichier chiffré non reconnu.');
  const meta=JSON.parse(lines[1]); const offset=new TextEncoder().encode(lines[0]+'\n'+lines[1]+'\n').length;
  const key=await deriveKey(password,unb64(meta.salt),meta.iter);
  try{ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(meta.iv)},key,await file.slice(offset).arrayBuffer()); return new Blob([pt],{type:'application/zip'}); }
  catch(e){ throw new Error('Mot de passe incorrect ou fichier endommagé.'); }
}

/* ---------- Fenêtre de progression ---------- */
function progressModal(title){
  openModal({title,body:`<p id="pgStep" class="soft" aria-live="polite">Préparation…</p><div class="prog" style="height:10px;margin-top:14px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pgBar"><span style="width:0%"></span></div><p class="muted small" id="pgSub" style="margin-top:10px"></p>`});
  const m=$('#modal'); $$('[data-close]',m).forEach(b=>b.style.visibility='hidden');
  return { set(step,pct,sub=''){ const s=$('#pgStep'); if(s) s.textContent=step; const b=$('#pgBar'); if(b){ b.firstChild.style.width=Math.round(pct*100)+'%'; b.setAttribute('aria-valuenow',Math.round(pct*100)); } const u=$('#pgSub'); if(u) u.textContent=sub; },
    done(){ $$('[data-close]',m).forEach(b=>b.style.visibility=''); closeModal(); } };
}

/* ============================================================
   CRÉATION D'UNE SAUVEGARDE
   mode : 'complete' | 'incremental' | 'selection'
   ============================================================ */
async function buildBackup(mode='complete',{ids=null,since=null,onProg=()=>{}}={}){
  let docs=allDocs(); let folders=allFolders();
  if(mode==='incremental'){ docs=docs.filter(d=>d.updatedAt>since); folders=folders.filter(f=>(f.updatedAt||f.createdAt)>since); }
  if(mode==='selection'){ docs=ids.map(docById).filter(Boolean); const need=new Set(); docs.forEach(d=>folderPath(d.folderId).forEach(f=>need.add(f.id))); folders=folders.filter(f=>need.has(f.id)); }
  const fileIds=[...new Set(docs.map(d=>d.fileId).filter(Boolean))];
  const Z=new ZipWriter(); const filesMeta=[]; let bytes=0; const missing=[];
  for(let k=0;k<fileIds.length;k++){
    const f=await getFileRec(fileIds[k]); if(!f){ missing.push(fileIds[k]); continue; }
    const d=docs.find(x=>x.fileId===f.id); const path=`files/${f.id}/${safeFileName(f.name||d?.fileName||'fichier')}`;
    onProg(`Ajout des fichiers originaux (${k+1}/${fileIds.length})`,.05+.85*(k/Math.max(1,fileIds.length)),f.name);
    const crc=await Z.add(path,f.blob,{date:new Date(f.createdAt||Date.now())});
    filesMeta.push({id:f.id,path,name:f.name,type:f.type,size:f.blob.size,crc32:crc.toString(16).padStart(8,'0'),sha256:f.algo==='SHA-256'||(f.hash&&!String(f.hash).startsWith('q-'))?f.hash:'',createdAt:f.createdAt||null});
    bytes+=f.blob.size;
  }
  onProg('Écriture des métadonnées…',.93);
  const cleanDocs=docs.map(d=>Object.assign({},d));
  const data={ 'data/documents.json':cleanDocs, 'data/folders.json':folders,
    'data/settings.json':mode==='selection'?{categories:S.settings.categories,docTypes:S.settings.docTypes}:S.settings,
    'data/activity.json':mode==='complete'?S.activity:[], 'data/alerts.json':mode==='complete'?S.alertStates:{} };
  const dataInfo={};
  for(const [p,v] of Object.entries(data)){ const txt=JSON.stringify(v); const crc=await Z.add(p,txt); dataInfo[p]={crc32:crc.toString(16).padStart(8,'0'),count:Array.isArray(v)?v.length:Object.keys(v).length}; }
  const manifest={format:BACKUP_FORMAT,formatVersion:BACKUP_FORMAT_VERSION,app:'Ondea Docs Manager',appVersion:APP_VERSION,schemaVersion:SCHEMA_VERSION,
    mode,since:since?new Date(since).toISOString():null,createdAt:new Date().toISOString(),company:S.settings.company.name||'',
    counts:{documents:docs.length,folders:folders.length,files:filesMeta.length,bytes},data:dataInfo,files:filesMeta,missingFiles:missing};
  await Z.add('manifest.json',JSON.stringify(manifest,null,2));
  await Z.add('LISEZMOI.txt',README_BACKUP(manifest));
  onProg('Finalisation de l\'archive…',.98);
  return {blob:Z.finish(),manifest};
}
const README_BACKUP=m=>`ONDEA DOCS MANAGER — ARCHIVE DE SAUVEGARDE
===========================================
Format : ${BACKUP_FORMAT} v${BACKUP_FORMAT_VERSION}   Application : ${m.appVersion}   Créée le : ${m.createdAt}
Type : ${m.mode==='complete'?'sauvegarde COMPLÈTE':m.mode==='incremental'?'sauvegarde INCRÉMENTALE (modifications depuis '+m.since+')':'export d\'une SÉLECTION de documents'}
Contenu : ${m.counts.documents} document(s), ${m.counts.folders} dossier(s), ${m.counts.files} fichier(s) original(aux).

Structure :
  manifest.json          Description de l'archive, liste des fichiers, contrôles CRC-32 et SHA-256
  data/documents.json    Métadonnées des documents (nom, catégorie, tiers, dates, montants, historique…)
  data/folders.json      Arborescence des dossiers (id, nom, parentId)
  data/settings.json     Paramètres de l'entreprise
  data/activity.json     Journal d'activité
  data/alerts.json       État des alertes d'échéance
  files/<id>/<nom>       Fichiers ORIGINAUX, identiques octet pour octet à ceux importés

Chaque document référence son fichier par "fileId" (= <id> du dossier files/).
Pour restaurer : Ondea Docs Manager > Sauvegarde & restauration > Restaurer / importer.
Les fichiers peuvent aussi être récupérés manuellement en extrayant cette archive (clic droit > Extraire tout).
`;
async function runBackup(mode,{password=null}={}){
  const b=S.settings.backup;
  const since=mode==='incremental'?Math.max(b.lastBackupAt||0,b.lastIncrementalAt||0):null;
  if(mode==='incremental'&&!since){ toast("Aucune sauvegarde précédente : réalisez d'abord une sauvegarde complète.",'warn',6000); return; }
  const pg=progressModal(mode==='complete'?'Sauvegarde complète':'Sauvegarde incrémentale');
  try{
    const {blob,manifest}=await buildBackup(mode,{since,onProg:(s,p,sub)=>pg.set(s,p,sub||'')});
    if(mode==='incremental'&&!manifest.counts.documents&&!manifest.counts.folders){ pg.done(); toast('Aucune modification depuis la dernière sauvegarde.','info'); return; }
    let out=blob, ext='zip';
    if(password){ pg.set('Chiffrement AES-256…',.99); out=await encryptBlob(blob,password); ext='odmx'; }
    const stamp=new Date(); const name=`ondea-docs-${mode==='complete'?'sauvegarde-complete':'sauvegarde-incrementale'}-${isoLocal(stamp)}-${pad2(stamp.getHours())}h${pad2(stamp.getMinutes())}.${ext}`;
    downloadBlob(out,name);
    if(mode==='complete') b.lastBackupAt=Date.now(); else b.lastIncrementalAt=Date.now();
    b.history=(b.history||[]); b.history.unshift({at:Date.now(),mode,docs:manifest.counts.documents,files:manifest.counts.files,bytes:out.size,name,encrypted:!!password}); b.history=b.history.slice(0,20);
    await saveSettings(); await logActivity(`a réalisé une sauvegarde ${mode==='complete'?'complète':'incrémentale'}`,`${manifest.counts.documents} documents, ${manifest.counts.files} fichiers (${fmtSize(out.size)})`);
    pg.done(); toast(`Sauvegarde prête : ${name} (${fmtSize(out.size)}). Conservez-la sur un support externe.`,'ok',8000);
    if(manifest.missingFiles.length) toast(`${manifest.missingFiles.length} fichier(s) introuvable(s) dans la base n'ont pas pu être inclus.`,'warn',8000);
    refreshShellBadges(); if(CUR.view==='sauvegarde') rerender();
  }catch(e){ console.error(e); pg.done(); toast('Échec de la sauvegarde : '+(e.message||e),'dng',9000); }
}
async function exportSelectionZip(ids){
  const pg=progressModal(`Export de ${plural(ids.length,'document')}`);
  try{ const {blob,manifest}=await buildBackup('selection',{ids,onProg:(s,p,sub)=>pg.set(s,p,sub||'')});
    downloadBlob(blob,`ondea-docs-selection-${todayISO()}-${ids.length}docs.zip`); pg.done();
    toast(`Archive ZIP prête : ${manifest.counts.files} fichier(s), ${fmtSize(blob.size)}. Réimportable via « Importation complémentaire ».`,'ok',7000);
    await logActivity('a exporté une sélection',`${ids.length} documents`);
  }catch(e){ pg.done(); toast('Échec de l\'export : '+(e.message||e),'dng',8000); }
}
function exportMetaJSON(){
  const data={format:'ondea-docs-metadata',formatVersion:1,note:'Métadonnées uniquement — les fichiers originaux ne sont PAS inclus. Utilisez la sauvegarde complète pour conserver les fichiers.',exportedAt:new Date().toISOString(),appVersion:APP_VERSION,schemaVersion:SCHEMA_VERSION,
    settings:S.settings,folders:allFolders(),documents:allDocs().map(d=>Object.assign({},d))};
  downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`ondea-docs-metadonnees-${todayISO()}.json`);

/* ============================================================
   RESTAURATION — contrôle de cohérence AVANT toute écriture
   ============================================================ */
function sanitizeDoc(d){
  if(!d||typeof d!=='object'||typeof d.id!=='string'||!d.id) return null;
  const b=blankDoc(); const out=Object.assign(b,d);
  out.title=String(out.title||'Document sans nom').slice(0,200);
  out.tags=Array.isArray(out.tags)?out.tags.map(String).slice(0,50):[];
  out.history=Array.isArray(out.history)?out.history.slice(0,120):[];
  ['createdAt','updatedAt'].forEach(k=>{ out[k]=Number(out[k])||Date.now(); });
  out.favorite=!!out.favorite; out.archived=!!out.archived; out.trashed=!!out.trashed;
  if(out.thumb&&!/^data:image\/(jpeg|png|webp);base64,/.test(out.thumb)) out.thumb=null;
  if(!CONFIDENTIALITY.find(c=>c.key===out.confidentiality)) out.confidentiality='interne';
  if(out.invoice&&!Array.isArray(out.invoice.payments)) out.invoice.payments=[];
  const r=migrateDoc(out); return r.doc;
}
async function analyzeBackup(file,onProg=()=>{}){
  const rep={errors:[],warnings:[],zip:null,manifest:null,docs:[],folders:[],settings:null,activity:[],alerts:{},fileOk:new Set()};
  let zip; try{ zip=await readZip(file); }catch(e){ rep.errors.push(e.message); return rep; }
  rep.zip=zip;
  if(!zip.has('manifest.json')){ rep.errors.push("manifest.json absent : ce ZIP n'est pas une sauvegarde Ondea Docs Manager."); return rep; }
  let man; try{ man=await zip.json('manifest.json'); }catch(e){ rep.errors.push(e.message); return rep; }
  rep.manifest=man;
  if(man.format!==BACKUP_FORMAT){ rep.errors.push('Format non reconnu : '+man.format); return rep; }
  if(man.formatVersion>BACKUP_FORMAT_VERSION){ rep.errors.push(`Sauvegarde créée par une version plus récente (format v${man.formatVersion}). Mettez à jour l'application.`); return rep; }
  for(const p of ['data/documents.json','data/folders.json']){ if(!zip.has(p)) rep.errors.push('Fichier manquant dans l\'archive : '+p); }
  if(rep.errors.length) return rep;
  // Contrôle CRC des données JSON
  for(const [p,info] of Object.entries(man.data||{})){ if(!zip.has(p)){ rep.warnings.push('Entrée absente : '+p); continue; } const e=zip.entries.get(p); if(info.crc32&&parseInt(info.crc32,16)!==e.crc) rep.errors.push('Somme de contrôle incorrecte pour '+p); }
  const rawDocs=await zip.json('data/documents.json').catch(e=>{ rep.errors.push(e.message); return []; });
  const rawFolders=await zip.json('data/folders.json').catch(e=>{ rep.errors.push(e.message); return []; });
  if(!Array.isArray(rawDocs)||!Array.isArray(rawFolders)){ rep.errors.push('Structure de données invalide.'); return rep; }
  rep.settings=zip.has('data/settings.json')?await zip.json('data/settings.json').catch(()=>null):null;
  rep.activity=zip.has('data/activity.json')?await zip.json('data/activity.json').catch(()=>[]):[];
  rep.alerts=zip.has('data/alerts.json')?await zip.json('data/alerts.json').catch(()=>({})):{};
  let bad=0; rawDocs.forEach(d=>{ const s=sanitizeDoc(d); if(s) rep.docs.push(s); else bad++; });
  if(bad) rep.warnings.push(`${bad} enregistrement(s) de document invalide(s) ignoré(s).`);
  rep.folders=rawFolders.filter(f=>f&&typeof f.id==='string'&&f.name).map(f=>({id:f.id,name:String(f.name).slice(0,80),parentId:f.parentId||null,createdAt:Number(f.createdAt)||Date.now(),updatedAt:Number(f.updatedAt)||Date.now()}));
  // Vérification des fichiers originaux (présence + CRC-32 recalculé)
  const fmap=new Map((man.files||[]).map(f=>[f.id,f]));
  const need=[...new Set(rep.docs.map(d=>d.fileId).filter(Boolean))];
  for(let k=0;k<need.length;k++){
    const fid=need[k]; const fm=fmap.get(fid);
    onProg(`Vérification de l'intégrité des fichiers (${k+1}/${need.length})`,k/Math.max(1,need.length));
    if(!fm||!zip.has(fm.path)){
      const local=await getFileRec(fid);
      if(local) rep.fileOk.add(fid); else rep.warnings.push(`Fichier original absent pour « ${rep.docs.find(d=>d.fileId===fid)?.title} ».`);
      continue; }
    try{ const e=zip.entries.get(fm.path); const blob=await zip.blob(fm.path); const crc=await crc32Blob(blob);
      if(crc!==e.crc||(fm.crc32&&parseInt(fm.crc32,16)!==crc)) rep.errors.push(`Fichier corrompu : ${fm.name} (somme de contrôle incorrecte).`);
      else if(blob.size!==fm.size) rep.errors.push(`Taille incorrecte : ${fm.name}.`);
      else rep.fileOk.add(fid);
    }catch(err){ rep.errors.push(`Lecture impossible : ${fm.name} (${err.message})`); }
  }
  // Cohérence des liens de dossiers
  const fids=new Set(rep.folders.map(f=>f.id));
  const orphan=rep.docs.filter(d=>d.folderId&&!fids.has(d.folderId)&&!folderById(d.folderId)).length;
  if(orphan) rep.warnings.push(`${orphan} document(s) référencent un dossier absent : ils seront placés à la racine.`);
  return rep;
}
/* Plan d'importation complémentaire : ajouts, mises à jour, doublons, conflits */
function planMerge(rep,{dupPolicy='skip',conflictPolicy='newest'}={}){
  const plan={add:[],update:[],same:[],dup:[],conflict:[],folderAdd:[],folderUpdate:[]};
  rep.docs.forEach(d=>{
    const loc=docById(d.id);
    if(!loc){ const dupOf=d.fileHash?allDocs().find(x=>x.fileHash===d.fileHash):null; if(dupOf) plan.dup.push({d,dupOf}); else plan.add.push(d); return; }
    if(d.updatedAt>loc.updatedAt) plan.update.push({d,loc});
    else if(d.updatedAt===loc.updatedAt) plan.same.push(d);
    else plan.conflict.push({d,loc});
  });
  rep.folders.forEach(f=>{ const l=folderById(f.id); if(!l) plan.folderAdd.push(f); else if((f.updatedAt||0)>(l.updatedAt||0)) plan.folderUpdate.push(f); });
  plan.toWrite=[...plan.add,...plan.update.map(x=>x.d),...(dupPolicy==='keep'?plan.dup.map(x=>x.d):[]),...(conflictPolicy==='backup'?plan.conflict.map(x=>x.d):[])];
  return plan;
}
async function fileRecFromZip(rep,fid){
  const fm=(rep.manifest.files||[]).find(f=>f.id===fid); if(!fm||!rep.zip.has(fm.path)) return null;
  const blob=await rep.zip.blob(fm.path,fm.type||'');
  return {id:fid,blob,name:fm.name,type:fm.type||blob.type,size:fm.size,hash:fm.sha256||'',algo:fm.sha256?'SHA-256':'',createdAt:fm.createdAt||Date.now()};
}
async function executeMerge(rep,plan,onProg){
  let ok=0, fail=0; const errs=[];
  for(const f of [...plan.folderAdd,...plan.folderUpdate]){ await IDB.put('folders',f); S.folders.set(f.id,f); }
  for(let k=0;k<plan.toWrite.length;k++){
    const d=plan.toWrite[k]; onProg(`Importation (${k+1}/${plan.toWrite.length})`,k/Math.max(1,plan.toWrite.length),d.title);
    try{
      if(d.folderId&&!folderById(d.folderId)) d.folderId=null;
      const loc=docById(d.id);
      let fr=null; if(d.fileId&&!(await getFileRec(d.fileId))) fr=await fileRecFromZip(rep,d.fileId);
      if(d.fileId&&!fr&&!(await getFileRec(d.fileId))){ d.fileId=null; d.fileName=d.fileName?d.fileName+' (fichier manquant)':''; }
      d.history=d.history||[]; d.history.unshift({at:Date.now(),action:loc?'Mis à jour par importation':'Importé depuis une sauvegarde',detail:rep.manifest.createdAt||''});
      const oldFile=loc&&loc.fileId&&loc.fileId!==d.fileId?loc.fileId:null;
      await IDB.tx(['docs','files'],'readwrite',st=>{ if(fr) st.files.put(fr); st.docs.put(d); if(oldFile&&!allDocs().some(x=>x.id!==d.id&&x.fileId===oldFile)) st.files.delete(oldFile); });
      S.docs.set(d.id,d); ok++;
    }catch(e){ fail++; errs.push(`${d.title} : ${storageErrorMessage(e)}`); }
  }
  // Catégories / types personnalisés utilisés par les documents importés
  if(rep.settings){ const s=S.settings; (rep.settings.categories||[]).forEach(c=>{ if(c&&c.key&&!s.categories.find(x=>x.key===c.key)) s.categories.push({key:String(c.key),label:String(c.label||c.key),icon:c.icon||'tag',builtin:false}); });
    (rep.settings.docTypes||[]).forEach(t=>{ if(t&&!s.docTypes.includes(t)) s.docTypes.push(String(t)); }); await saveSettings(); }
  await logActivity('a importé une sauvegarde (complémentaire)',`${ok} document(s) ajouté(s) ou mis à jour`);
  return {ok,fail,errs};
}
/* Restauration COMPLÈTE : une seule transaction IndexedDB (tout ou rien) */
async function executeFullRestore(rep,onProg){
  const files=[]; const need=[...new Set(rep.docs.map(d=>d.fileId).filter(Boolean))];
  for(let k=0;k<need.length;k++){ onProg(`Préparation des fichiers (${k+1}/${need.length})`,k/Math.max(1,need.length)); const fr=await fileRecFromZip(rep,need[k]); if(fr) files.push(fr); }
  const have=new Set(files.map(f=>f.id));
  rep.docs.forEach(d=>{ if(d.fileId&&!have.has(d.fileId)){ d.fileId=null; } if(d.folderId&&!rep.folders.find(f=>f.id===d.folderId)) d.folderId=null; });
  const settings=normalizeSettings(rep.settings||S.settings);
  onProg('Écriture dans la base locale (transaction unique)…',.95);
  await IDB.tx(STORES,'readwrite',st=>{
    STORES.forEach(n=>st[n].clear());
    files.forEach(f=>st.files.put(f)); rep.docs.forEach(d=>st.docs.put(d)); rep.folders.forEach(f=>st.folders.put(f));
    (Array.isArray(rep.activity)?rep.activity:[]).slice(0,500).forEach(a=>{ if(a&&a.id) st.activity.put(a); });
    st.meta.put({key:'settings',value:settings}); st.meta.put({key:'alertStates',value:rep.alerts&&typeof rep.alerts==='object'?rep.alerts:{}}); st.meta.put({key:'schemaVersion',value:SCHEMA_VERSION}); st.meta.put({key:'initialized',value:true});
  });
  await loadAll(); await logActivity('a restauré une sauvegarde complète',`${rep.docs.length} documents, ${files.length} fichiers`);
}

/* ---------- Assistant de restauration ---------- */
async function restoreWizard(file){
  if(!file) return;
  let src=file;
  if(await isEncrypted(file)){
    return promptDialog({title:'Sauvegarde chiffrée',label:'Mot de passe de la sauvegarde',yes:'Déchiffrer',hint:'Le mot de passe choisi lors de la création de la sauvegarde.',onSubmit:async pw=>{
      const pg=progressModal('Déchiffrement'); pg.set('Déchiffrement AES-256 en cours…',.5);
      try{ const z=await decryptFile(file,pw); pg.done(); setTimeout(()=>restoreWizard(new File([z],file.name.replace(/\.odmx$/,'.zip'),{type:'application/zip'})),50); }
      catch(e){ pg.done(); toast(e.message,'dng',6000); setTimeout(()=>restoreWizard(file),80); } return false; }});
  }
  const pg=progressModal('Analyse de la sauvegarde');
  let rep; try{ rep=await analyzeBackup(src,(s,p)=>pg.set(s,p)); }catch(e){ pg.done(); toast('Analyse impossible : '+(e.message||e),'dng',8000); return; }
  pg.done();
  const man=rep.manifest||{};
  if(rep.errors.length){
    return openModal({title:'Sauvegarde refusée',body:`<div class="warn-box dng">${svg('warn')}<div><b>Le contrôle de cohérence a échoué. Aucune donnée n'a été modifiée.</b></div></div><ul style="margin-left:18px;line-height:1.7">${rep.errors.slice(0,20).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`,footer:`<button class="btn gold" data-close>Fermer</button>`});
  }
  let mode=man.mode==='complete'?'merge':'merge', dupPolicy='skip', conflictPolicy='newest';
  const draw=()=>{
    const plan=planMerge(rep,{dupPolicy,conflictPolicy});
    const local=allDocs().length;
    openModal({title:'Restaurer ou importer une sauvegarde',size:'wide',body:`
      <div class="warn-box ok">${svg('check')}<div><b>Contrôle de cohérence réussi.</b> Sauvegarde ${man.mode==='complete'?'complète':man.mode==='incremental'?'incrémentale':'(sélection)'} du ${esc(fmtDateTime(Date.parse(man.createdAt)))}${man.company?` — ${esc(man.company)}`:''} · format v${man.formatVersion} · ${rep.fileOk.size} fichier(s) vérifié(s) (CRC-32).</div></div>
      ${rep.warnings.length?`<div class="warn-box">${svg('warn')}<div>${rep.warnings.slice(0,8).map(esc).join('<br>')}</div></div>`:''}
      <div class="sum-grid"><div class="sum-cell"><span class="n">${rep.docs.length}</span><small>documents dans l'archive</small></div><div class="sum-cell"><span class="n">${rep.folders.length}</span><small>dossiers</small></div><div class="sum-cell"><span class="n">${fmtSize(man.counts?.bytes||0)}</span><small>de fichiers originaux</small></div><div class="sum-cell"><span class="n">${local}</span><small>documents actuellement dans l'application</small></div></div>
      <div class="field"><label>Mode de restauration</label>
        <label class="set-row" style="cursor:pointer"><div class="lbl"><b>Importation complémentaire (recommandée)</b><small>Ajoute les nouveaux documents et met à jour ceux qui existent déjà (même identifiant). N'efface JAMAIS les documents absents de l'archive.</small></div><input type="radio" name="rsMode" value="merge" ${mode==='merge'?'checked':''} style="width:18px;height:18px;accent-color:var(--or-500)"></label>
        <label class="set-row" style="cursor:pointer;${man.mode!=='complete'?'opacity:.5':''}"><div class="lbl"><b>Restauration complète</b><small>${man.mode==='complete'?'Remplace INTÉGRALEMENT les données actuelles par le contenu de l\'archive.':'Indisponible : cette archive n\'est pas une sauvegarde complète.'}</small></div><input type="radio" name="rsMode" value="full" ${mode==='full'?'checked':''} ${man.mode!=='complete'?'disabled':''} style="width:18px;height:18px;accent-color:var(--or-500)"></label></div>
      <div id="rsPlan"></div>`,
      footer:`<button class="btn ghost" data-close>Annuler</button><button class="btn gold" id="rsGo">${svg('restore')} Continuer</button>`,
      onOpen:m=>{
        const drawPlan=()=>{ const p=planMerge(rep,{dupPolicy,conflictPolicy}); const box=$('#rsPlan',m);
          if(mode==='full'){ box.innerHTML=`<div class="warn-box dng">${svg('warn')}<div><b>Attention :</b> les ${plural(local,'document actuel','documents actuels')}, leurs fichiers, dossiers, paramètres et journal seront <b>supprimés</b> puis remplacés par les ${rep.docs.length} documents de la sauvegarde. L'opération est réalisée en une seule transaction : en cas d'erreur, rien n'est modifié.</div></div>
            <label class="row" style="cursor:pointer;margin-top:4px"><input type="checkbox" class="cbx" id="rsSafety" checked> <span>Télécharger d'abord une sauvegarde de sécurité des données actuelles (recommandé)</span></label>`; return; }
          box.innerHTML=`<div class="eyebrow" style="margin:6px 0 10px">Récapitulatif avant importation</div>
            <div class="sum-grid"><div class="sum-cell ok"><span class="n">${p.add.length}</span><small>documents ajoutés</small></div><div class="sum-cell info"><span class="n">${p.update.length}</span><small>documents mis à jour (version de l'archive plus récente)</small></div>
            <div class="sum-cell warn"><span class="n">${p.dup.length}</span><small>doublons détectés (même fichier)</small></div><div class="sum-cell dng"><span class="n">${p.conflict.length}</span><small>conflits (version locale plus récente)</small></div>
            <div class="sum-cell"><span class="n">${p.same.length}</span><small>identiques (ignorés)</small></div><div class="sum-cell"><span class="n">${p.folderAdd.length}</span><small>dossiers ajoutés</small></div></div>
            ${p.dup.length?`<div class="field"><label for="rsDup">Doublons (${p.dup.length})</label><select class="sel" id="rsDup">${opt('skip','Ne pas importer les doublons',dupPolicy)}${opt('keep','Importer quand même une copie',dupPolicy)}</select><span class="hint">${p.dup.slice(0,4).map(x=>esc(x.d.title)+' ≈ '+esc(x.dupOf.title)).join(' · ')}</span></div>`:''}
            ${p.conflict.length?`<div class="field"><label for="rsConf">Conflits (${p.conflict.length})</label><select class="sel" id="rsConf">${opt('newest','Conserver la version la plus récente (locale)',conflictPolicy)}${opt('backup','Remplacer par la version de la sauvegarde',conflictPolicy)}</select><span class="hint">${p.conflict.slice(0,4).map(x=>esc(x.d.title)).join(' · ')}</span></div>`:''}
            <p class="soft small"><b>${plural(p.toWrite.length,'document sera écrit','documents seront écrits')}</b> · aucun document existant ne sera supprimé.</p>`;
          const a=$('#rsDup',m); if(a) a.onchange=()=>{ dupPolicy=a.value; drawPlan(); };
          const c=$('#rsConf',m); if(c) c.onchange=()=>{ conflictPolicy=c.value; drawPlan(); };
        };
        $$('input[name=rsMode]',m).forEach(r=>r.onchange=()=>{ mode=r.value; drawPlan(); }); drawPlan();
        $('#rsGo',m).onclick=async()=>{
          if(mode==='full'){
            const safety=$('#rsSafety',m)?.checked;
            confirmDialog(`Remplacer toutes les données actuelles (${plural(local,'document')}) par la sauvegarde du ${fmtDateTime(Date.parse(man.createdAt))} ?`,async()=>{
              if(safety&&local){ closeModal(); await runBackup('complete'); await sleep(400); }
              const pg2=progressModal('Restauration complète');
              try{ await executeFullRestore(rep,(s,p)=>pg2.set(s,p)); pg2.done(); buildShell(); navigate('dashboard'); toast(`Restauration terminée : ${rep.docs.length} documents restaurés.`,'ok',7000); }
              catch(e){ console.error(e); pg2.done(); await loadAll(); toast('Restauration annulée, aucune donnée modifiée : '+storageErrorMessage(e),'dng',10000); }
            },{yes:'Restaurer et remplacer',typed:'RESTAURER',title:'Restauration complète'});
            return;
          }
          const p=planMerge(rep,{dupPolicy,conflictPolicy});
          if(!p.toWrite.length&&!p.folderAdd.length){ closeModal(); toast('Rien à importer : toutes les données sont déjà à jour.','info'); return; }
          const pg2=progressModal('Importation complémentaire');
          try{ const r=await executeMerge(rep,p,(s,pp,sub)=>pg2.set(s,pp,sub||'')); pg2.done(); buildShell(); rerender();
            openModal({title:'Importation terminée',body:`<div class="sum-grid"><div class="sum-cell ok"><span class="n">${p.add.length+(dupPolicy==='keep'?p.dup.length:0)}</span><small>ajoutés</small></div><div class="sum-cell info"><span class="n">${p.update.length+(conflictPolicy==='backup'?p.conflict.length:0)}</span><small>mis à jour</small></div><div class="sum-cell warn"><span class="n">${dupPolicy==='skip'?p.dup.length:0}</span><small>doublons ignorés</small></div><div class="sum-cell dng"><span class="n">${r.fail}</span><small>erreurs</small></div></div>${r.errs.length?`<ul style="margin-left:18px">${r.errs.slice(0,10).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}<p class="soft">Les documents existants absents de l'archive ont été conservés.</p>`,footer:'<button class="btn gold" data-close>Fermer</button>'});
          }catch(e){ pg2.done(); toast('Importation interrompue : '+storageErrorMessage(e),'dng',9000); rerender(); }
        };
      }});
  };
  draw();
}

/* ---------- Rapports et statistiques ---------- */
VIEWS.rapports=(el)=>{
  const live=liveDocs(), act=activeDocs(); const cur=S.settings.currency||'EUR';

  const agg=dir=>{ const L=inv.filter(d=>d.invoice.direction===dir); const t=round2(L.reduce((s,d)=>s+(invoiceAmounts(d.invoice).ttc||0),0)); const p=round2(L.reduce((s,d)=>s+invoiceAmounts(d.invoice).paid,0)); return {n:L.length,t,p,r:round2(t-p),late:L.filter(d=>invoiceStatusKey(d.invoice)==='retard').length}; };
  const C=agg('client'), F=agg('fournisseur'); const rate=C.t?Math.round(C.p/C.t*100):0;
  const cStat={}; act.filter(d=>d.category==='contrat').forEach(d=>{ const k=contractStatusKey(d.contract); cStat[k]=(cStat[k]||0)+1; });
  const qs=act.filter(d=>d.category==='devis'); const qAcc=qs.filter(d=>['accepte','commande'].includes(quoteStatusKey(d.quote))).length, qDec=qs.filter(d=>['accepte','commande','refuse'].includes(quoteStatusKey(d.quote))).length;
  const byCat=cats().map(c=>[c.label,live.filter(d=>d.category===c.key).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const volCat=cats().map(c=>[c.label,live.filter(d=>d.category===c.key).reduce((s,d)=>s+(d.fileSize||0),0)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const parties={}; live.forEach(d=>{ if(d.party) parties[d.party]=(parties[d.party]||0)+1; }); const topP=Object.entries(parties).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const fmts={}; live.filter(d=>d.fileId).forEach(d=>{ const e=extOf(d.fileName).toUpperCase()||'?'; fmts[e]=(fmts[e]||0)+1; });
  const dups=duplicateGroups(); const att=act.filter(needsAttention);
  el.innerHTML=pageHead('Rapports et statistiques','Indicateurs calculés sur vos données',`<button class="btn" id="rpCsv">${svg('table')} Exporter la liste (CSV)</button><button class="btn" id="rpPrint">${svg('fileText')} Imprimer</button>`)+demoBanner()+
    `<div class="kpi-grid">
      <div class="kpi"><div class="ic">${svg('files')}</div><div class="num">${live.length}</div><div class="lbl">Documents (${act.length} actifs, ${live.length-act.length} archivés)</div></div>
      <div class="kpi"><div class="ic">${svg('database')}</div><div class="num" style="font-size:1.8rem">${fmtSize(bytes)}</div><div class="lbl">Volume des fichiers originaux</div></div>
      <div class="kpi"><div class="ic ok">${svg('euro')}</div><div class="num">${rate}%</div><div class="lbl">Factures clients encaissées (en montant)</div></div>
      <div class="kpi"><div class="ic ${dups.length?'warn':'ok'}">${svg('copy')}</div><div class="num">${dups.length}</div><div class="lbl">Groupe(s) de doublons</div></div>
    </div>
    <div class="cols">
      <div class="panel"><div class="panel-h"><h3>Documents ajoutés par mois (12 mois)</h3></div><div class="panel-b">${barsHTML(addedPerMonth(12))}</div></div>
      <div class="panel"><div class="panel-h"><h3>Encaissement des factures clients</h3></div><div class="panel-b center" style="flex-direction:column;gap:14px">
        <div class="donut" style="--p:${rate}" role="img" aria-label="${rate} % encaissé"><span class="val">${rate}%</span></div>
        <small class="muted">${esc(fmtMoney(C.p,cur))} encaissés sur ${esc(fmtMoney(C.t,cur))} facturés</small></div></div>
    </div>
    <div class="panel" style="margin-top:20px"><div class="panel-h"><h3>Suivi financier (${esc(cur)})</h3><span class="muted small">Hors factures annulées · archives exclues</span></div><div class="tbl-wrap" style="border:none;box-shadow:none;border-radius:0"><table class="tbl"><thead><tr><th>Type</th><th class="tr">Nombre</th><th class="tr">Total TTC</th><th class="tr">Réglé</th><th class="tr">Reste dû</th><th class="tr">En retard</th></tr></thead><tbody>
      <tr style="cursor:default"><td><b>Factures clients</b></td><td class="tr mono">${C.n}</td><td class="tr amount">${esc(fmtMoney(C.t,cur))}</td><td class="tr amount">${esc(fmtMoney(C.p,cur))}</td><td class="tr amount"><b>${esc(fmtMoney(C.r,cur))}</b></td><td class="tr">${C.late?`<span class="chip dng">${C.late}</span>`:'0'}</td></tr>
      <tr style="cursor:default"><td><b>Factures fournisseurs</b></td><td class="tr mono">${F.n}</td><td class="tr amount">${esc(fmtMoney(F.t,cur))}</td><td class="tr amount">${esc(fmtMoney(F.p,cur))}</td><td class="tr amount"><b>${esc(fmtMoney(F.r,cur))}</b></td><td class="tr">${F.late?`<span class="chip dng">${F.late}</span>`:'0'}</td></tr>
    </tbody></table></div></div>
    <div class="dash-cols-3">

      <div class="panel"><div class="panel-h"><h3>Tiers les plus fréquents</h3></div><div class="panel-b">${statRows(topP)}</div></div>
      <div class="panel"><div class="panel-h"><h3>Contrats par statut</h3></div><div class="panel-b">${statRows(Object.entries(cStat).map(([k,v])=>[CONTRACT_STATUS[k].label,v]))}</div></div>
      <div class="panel"><div class="panel-h"><h3>Devis</h3></div><div class="panel-b">${statRows(Object.entries(QUOTE_STATUS).map(([k,v])=>[v.label,qs.filter(d=>quoteStatusKey(d.quote)===k).length]).filter(x=>x[1]))}<p class="muted small" style="margin-top:10px">Taux d'acceptation : <b>${qDec?Math.round(qAcc/qDec*100):0} %</b> (${qAcc}/${qDec} devis ayant reçu une réponse)</p></div></div>

    </div>
    <div class="cols" style="margin-top:20px">
      <div class="panel"><div class="panel-h"><h3>Doublons détectés</h3><span class="chip ${dups.length?'warn':''}">${dups.length}</span></div><div class="panel-b">
        ${dups.length?dups.map(g=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><small class="muted mono">${esc(g[0].fileName)} · ${fmtSize(g[0].fileSize)}</small><div class="row wrap" style="gap:6px;margin-top:6px">${g.map(d=>`<button class="btn sm ghost" data-open="${esc(d.id)}">${esc(d.title)}${d.archived?' (archivé)':''}</button>`).join('')}</div></div>`).join(''):'<p class="muted small">Aucun doublon : chaque fichier est unique (comparaison des empreintes SHA-256).</p>'}</div></div>

        ${att.length?att.slice(0,10).map(d=>`<div class="feed-item" style="cursor:pointer" data-open="${esc(d.id)}" tabindex="0" role="button"><span class="txt"><b>${esc(d.title)}</b><br><small class="muted">${esc(docAttention(d).join(' · '))}</small></span></div>`).join('')+(att.length>10?`<button class="btn sm ghost" id="rpAtt">Voir les ${att.length}</button>`:''):'<p class="muted small">Tout est complet.</p>'}</div></div>

};

    <div class="panel"><div class="panel-b">${list.length?list.slice(0,300).map(a=>`<div class="feed-item"><span class="tm mono" style="width:120px">${fmtDateTime(a.at)}</span>
      <span class="txt">Vous ${esc(a.text)} ${a.docTitle?(a.docId&&docById(a.docId)?`<button class="btn sm ghost" data-open="${esc(a.docId)}" style="padding:1px 7px;font-weight:700">${esc(a.docTitle)}</button>`:`<b>${esc(a.docTitle)}</b>`):''}</span></div>`).join(''):emptyHTML('clock','Aucune activité','Les actions réalisées dans l\'application apparaîtront ici.')}</div></div>`;

};

/* ---------- Sauvegarde & restauration ---------- */
VIEWS.sauvegarde=(el)=>{
  const b=S.settings.backup; const n=allDocs().length, bytes=allDocs().reduce((s,d)=>s+(d.fileSize||0),0);
  const since=Math.max(b.lastBackupAt||0,b.lastIncrementalAt||0); const changed=since?allDocs().filter(d=>d.updatedAt>since).length:null;

    ${b.lastBackupAt?` Dernière sauvegarde complète : <b>${fmtDateTime(b.lastBackupAt)}</b>.`:' <b>Aucune sauvegarde complète réalisée pour le moment.</b>'}</div></div>

        <label class="row" style="cursor:pointer;margin-bottom:10px"><input type="checkbox" class="cbx" id="bkEnc"> <span>Chiffrer la sauvegarde avec un mot de passe (AES-256)</span></label>

          <p class="hint muted small" style="margin:-6px 0 12px">Sans ce mot de passe, la sauvegarde chiffrée (.odmx) est irrécupérable. Il n'est enregistré nulle part.</p></div>
        <button class="btn gold" id="bkFull">${svg('database')} Créer une sauvegarde complète</button></div></div>
      <div class="panel"><div class="panel-h"><h3>Sauvegarde incrémentale</h3>${changed!==null?`<span class="chip ${changed?'warn':'ok'}">${plural(changed,'document modifié','documents modifiés')}</span>`:''}</div><div class="panel-b">
        <p class="soft small" style="margin-bottom:14px;line-height:1.6">Ne contient que les documents ajoutés ou modifiés depuis la dernière sauvegarde (${since?fmtDateTime(since):'aucune'}), avec leurs fichiers. À restaurer via l'<b>importation complémentaire</b>, après la dernière sauvegarde complète.</p>
        <button class="btn" id="bkInc" ${!since?'disabled':''}>${svg('database')} Créer une sauvegarde incrémentale</button></div></div>
      <div class="panel"><div class="panel-h"><h3>Exports</h3></div><div class="panel-b">
        <div class="row wrap"><button class="btn" id="bkJson">${svg('down')} Métadonnées (JSON)</button><button class="btn" id="bkCsv">${svg('table')} Liste des documents (CSV)</button></div>
        <p class="muted small" style="margin-top:10px">L'export JSON ne contient <b>pas</b> les fichiers. Pour exporter une sélection de fichiers en ZIP, cochez des documents dans une liste puis « Exporter (ZIP) ».</p></div></div>
    </div>
    <div class="stack">
      <div class="panel"><div class="panel-h"><h3>Restaurer ou importer</h3></div><div class="panel-b">
        <div class="dropzone" id="rsDrop" tabindex="0" role="button">${svg('restore')}<b>Choisir une sauvegarde (.zip ou .odmx)</b><small>ou glissez-déposez le fichier ici</small><input type="file" id="rsFile" accept=".zip,.odmx,application/zip" hidden></div>
        <ul class="soft small" style="margin:14px 0 0 18px;line-height:1.7"><li>L'archive est entièrement <b>vérifiée</b> (structure, sommes de contrôle, fichiers) avant toute modification.</li><li>Un <b>récapitulatif</b> (ajouts, mises à jour, doublons, conflits) est affiché avant l'opération.</li><li>L'<b>importation complémentaire</b> n'efface jamais les documents existants.</li><li>La <b>restauration complète</b> exige une confirmation explicite et propose une sauvegarde de sécurité préalable.</li></ul></div></div>
      <div class="panel"><div class="panel-h"><h3>Historique des sauvegardes</h3></div><div class="panel-b">
        ${(b.history||[]).length?b.history.map(h=>`<div class="feed-item"><span class="tm" style="width:120px">${fmtDateTime(h.at)}</span><span class="txt"><b>${h.mode==='complete'?'Complète':'Incrémentale'}</b>${h.encrypted?' 🔒':''} — ${h.docs} doc., ${h.files} fichiers, ${fmtSize(h.bytes)}<br><small class="muted mono">${esc(h.name)}</small></span></div>`).join(''):'<p class="muted small">Aucune sauvegarde réalisée depuis ce navigateur.</p>'}</div></div>
      <div class="panel"><div class="panel-h"><h3>Stockage du navigateur</h3></div><div class="panel-b" id="bkStore">${storageInfoHTML()}</div></div>

  $('#bkEnc',el).onchange=e=>$('#bkEncBox',el).classList.toggle('hide',!e.target.checked);
  $('#bkFull',el).onclick=()=>{ let pw=null; if($('#bkEnc',el).checked){ pw=$('#bkPw',el).value; if(pw.length<8){ $('#bkPw',el).focus(); toast('Mot de passe : 8 caractères minimum.','warn'); return; } if(pw!==$('#bkPw2',el).value){ $('#bkPw2',el).focus(); toast('Les mots de passe ne correspondent pas.','warn'); return; } } runBackup('complete',{password:pw}); };

  ['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.remove('over'); }));
  dz.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) restoreWizard(f); });
  bindStorageInfo(el);
};
function storageInfoHTML(){
  const e=STORAGE_EST; const pct=e&&e.quota?Math.round(e.usage/e.quota*100):0;
  return `${e?`<div class="info-line"><span class="k">Utilisé</span><span class="v mono">${fmtSize(e.usage)} (${pct} %)</span></div><div class="info-line"><span class="k">Disponible pour ce site</span><span class="v mono">${fmtSize(e.quota)}</span></div>
    <div class="prog" style="margin:10px 0" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Espace utilisé"><span style="width:${pct}%"></span></div>`:'<p class="muted small">Estimation indisponible dans ce navigateur.</p>'}
    <div class="info-line"><span class="k">Stockage persistant</span><span class="v">${e&&e.persisted?'<span class="chip ok">Activé</span>':'<span class="chip warn">Non garanti</span>'}</span></div>
    ${e&&!e.persisted?`<button class="btn sm" id="stPersist" style="margin-top:12px">${svg('shield')} Demander un stockage persistant</button>`:''}
    <p class="muted small" style="margin-top:10px">Le stockage persistant réduit le risque que le navigateur efface les données en cas de manque d'espace. Il ne remplace pas une sauvegarde externe.</p>`;
}
function bindStorageInfo(el){ const p=$('#stPersist',el); if(p) p.onclick=async()=>{ try{ const ok=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false; await refreshStorage(); toast(ok?'Stockage persistant activé':'Le navigateur a refusé le stockage persistant (il l\'accorde généralement aux sites favoris ou installés).',ok?'ok':'warn',7000); rerender(); }catch(e){ toast('Fonction indisponible','warn'); } }; }
async function refreshStorage(){
  try{ if(navigator.storage&&navigator.storage.estimate){ const e=await navigator.storage.estimate(); const persisted=navigator.storage.persisted?await navigator.storage.persisted():false; STORAGE_EST={usage:e.usage||0,quota:e.quota||0,persisted}; } }catch(e){ STORAGE_EST=null; }
  const w=$('#sbStore'); if(w&&STORAGE_EST){ const pct=STORAGE_EST.quota?Math.min(100,STORAGE_EST.usage/STORAGE_EST.quota*100):0;
    w.innerHTML=`<div class="top"><span>Stockage local</span><b>${fmtSize(STORAGE_EST.usage)}</b></div><div class="prog" aria-hidden="true"><span style="width:${Math.max(2,pct)}%"></span></div><small>${plural(liveDocs().length,'document')} · ${pct<1?'< 1':Math.round(pct)} % de ${fmtSize(STORAGE_EST.quota)}</small>`; }
}

async function resizeLogo(file){
  if(file.type==='image/svg+xml') throw new Error('SVG');
  const u=URL.createObjectURL(file); try{ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; });
    const M=160, r=Math.min(1,M/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*r)); c.height=Math.max(1,Math.round(img.height*r));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/png'); } finally{ URL.revokeObjectURL(u); }
}

/* ============================================================
   MODULE 16 — VERROUILLAGE LOCAL DE L'INTERFACE (code PIN)
   Code dérivé par PBKDF2-SHA256 (sel aléatoire) : jamais stocké en clair.
   ⚠ Ne chiffre PAS les données : protection d'accès à l'interface uniquement.
   ============================================================ */
const LOCK={
  KEY:'ondea_docs_lock', locked:false, idleTimer:null, fails:0, until:0,
  cfg(){ try{ return JSON.parse(STORE.getItem(this.KEY)||'null'); }catch(e){ return null; } },
  enabled(){ const c=this.cfg(); return !!(c&&c.hash); },
  async hash(pin,salt,iter=150000){ if(!crypto.subtle) return 'plain-'+pin; const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']); const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,256); return hex(bits); },
  async set(pin){ const salt=crypto.getRandomValues(new Uint8Array(16)); STORE.setItem(this.KEY,JSON.stringify({salt:b64(salt),iter:150000,hash:await this.hash(pin,salt)})); },
  async check(pin){ const c=this.cfg(); if(!c) return true; return (await this.hash(pin,unb64(c.salt),c.iter))===c.hash; },
  disable(){ STORE.removeItem(this.KEY); },
  setupDialog(change=false){
    const go=()=>openModal({title:change?'Changer le code de verrouillage':'Activer le verrouillage par code',body:`<div class="warn-box info">${svg('info')}<div>Le code masque l'interface (au démarrage, sur demande ou après inactivité). Il <b>ne chiffre pas</b> les documents. En cas d'oubli, seule une réinitialisation du navigateur permet de retrouver l'accès : conservez une sauvegarde.</div></div>
      <div class="grid-2"><div class="field"><label for="lk1">Nouveau code (4 à 12 chiffres)</label><input class="inp pin-inp" id="lk1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12"></div><div class="field"><label for="lk2">Confirmation</label><input class="inp pin-inp" id="lk2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12"></div></div>`,
      footer:`<button class="btn ghost" data-close>Annuler</button><button class="btn gold" id="lkSave">${svg('lock')} Enregistrer le code</button>`,
      onOpen:m=>{ $('#lkSave',m).onclick=async()=>{ const a=$('#lk1',m).value, b=$('#lk2',m).value; if(!/^\d{4,12}$/.test(a)){ $('#lk1',m).focus(); toast('Le code doit contenir 4 à 12 chiffres.','warn'); return; } if(a!==b){ $('#lk2',m).focus(); toast('Les codes ne correspondent pas.','warn'); return; }
        await this.set(a); closeModal(); buildShell(); toast('Verrouillage par code activé','ok'); await logActivity('a configuré le verrouillage par code'); if(CUR.view==='parametres') rerender(); }; }});
    if(change) this.verifyDialog('Code actuel',go); else go();
  },
  verifyDialog(title,ok){ openModal({title,body:`<div class="field"><label for="lkV">Code actuel</label><input class="inp pin-inp" id="lkV" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" autofocus></div>`,footer:`<button class="btn ghost" data-close>Annuler</button><button class="btn gold" id="lkVok">Valider</button>`,
    onOpen:m=>{ const go=async()=>{ if(await this.check($('#lkV',m).value)){ closeModal(); setTimeout(ok,50); } else { toast('Code incorrect.','dng'); $('#lkV',m).select(); } }; $('#lkVok',m).onclick=go; $('#lkV',m).onkeydown=e=>{ if(e.key==='Enter') go(); }; }}); },
  lock(){ if(!this.enabled()) return; this.locked=true; closeModal(); closeConfirm(); closeDrawer(); closeDrops(); revokeTag('preview'); $('#app').classList.remove('on'); showGate('lock'); },
  armIdle(){ clearTimeout(this.idleTimer); const m=Number(S.settings&&S.settings.privacy.autoLockMin)||0; if(!m||!this.enabled()||this.locked) return; this.idleTimer=setTimeout(()=>this.lock(),m*60000); }
};
['mousemove','keydown','mousedown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{ if(!LOCK.locked) LOCK.armIdle(); },{passive:true,capture:true}));

function removeDemoDialog(){
  const ids=allDocs().filter(d=>d.demo).map(d=>d.id);
  if(!ids.length){ toast('Aucune donnée de démonstration.','info'); return; }
  confirmDialog(`Supprimer définitivement les ${plural(ids.length,'document de démonstration','documents de démonstration')} et leurs fichiers ? Vos propres documents ne seront pas modifiés.`,async()=>{
    await purgeDocs(ids);
    // Dossiers de démo supprimés s'ils ne contiennent plus aucun document réel
    const demoF=allFolders().filter(f=>f.demo).sort((a,b)=>folderPath(b.id).length-folderPath(a.id).length);
    for(const f of demoF){ const inside=[f.id,...folderDescendants(f.id)]; const used=allDocs().some(d=>inside.includes(d.folderId)); const realKids=folderChildren(f.id).some(c=>!c.demo);
      if(!used&&!realKids){ await IDB.del('folders',f.id); S.folders.delete(f.id); } }
    Object.keys(S.alertStates).forEach(k=>{ if(ids.includes(k.split('|')[0])) delete S.alertStates[k]; }); await IDB.setMeta('alertStates',S.alertStates);
    S.settings.demoLoaded=false; await saveSettings();
    await logActivity('a supprimé les données de démonstration',`${ids.length} documents`);
    buildShell(); toast('Données de démonstration supprimées','ok'); rerender();
  },{yes:'Supprimer la démonstration'});
}

/* ---------- Initialisation ---------- */
async function init(){
  applyTheme(PREFS.theme||'dark'); applyContrast(PREFS.contrast==='high'); applyFontScale(PREFS.fs||1); applyMotion(PREFS.motion==='reduce');
  showGate('loading');
  try{
    await Promise.race([IDB.open(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("Délai dépassé lors de l'ouverture de la base (fermez les autres onglets de l'application).")),8000))]);
    const mig=await runMigrations(); await loadAll();
    if(mig.failed) toast(`${mig.failed} document(s) n'ont pas pu être migrés : ils sont conservés dans leur format d'origine.`,'warn',9000);
  }catch(e){ console.error(e); showGate('error',storageErrorMessage(e)); return; }
  refreshStorage();
  const initialized=await IDB.getMeta('initialized',false);
  if(LOCK.enabled()){ LOCK.locked=true; showGate('lock'); }
  else if(STORE.getItem(SESSION_KEY)==='out'&&initialized){ showGate('loggedout'); }
  else if(!initialized&&!allDocs().length){ showGate('welcome'); }
  else { if(!initialized) await IDB.setMeta('initialized',true); enterApp(); }
  bindGlobal();
}
function bindGlobal(){
  $('#themeBtn').onclick=toggleTheme; $('#loginThemeBtn').onclick=toggleTheme;

  $('#topAdd').onclick=()=>docForm({preset:contextPreset()});
  $('#logoutBtn').onclick=logout;
  DROPS.forEach(([b,d,r])=>$(b).onclick=e=>{ e.stopPropagation(); toggleDrop(b,d,r); });
  document.addEventListener('click',e=>{ if(!e.target.isConnected) return; if(!e.target.closest('.dropdown')&&!DROPS.some(([b])=>e.target.closest(b))) closeDrops(); if(!e.target.closest('.search')) closeSuggest(); });
  $('.skip-link').onclick=e=>{ e.preventDefault(); $('#main').focus(); };
  /* Recherche globale */
  const gs=$('#globalSearch');
  gs.addEventListener('input',debounce(()=>renderSuggest(gs.value),120));
  gs.addEventListener('focus',()=>{ if(gs.value.trim()) renderSuggest(gs.value); });
  gs.addEventListener('keydown',e=>{
    const items=$$('#searchSuggest .sug-item'); const open=!$('#searchSuggest').classList.contains('hide');
    if(e.key==='ArrowDown'&&open){ e.preventDefault(); SUG_I=(SUG_I+1)%items.length; }
    else if(e.key==='ArrowUp'&&open){ e.preventDefault(); SUG_I=(SUG_I-1+items.length)%items.length; }
    else if(e.key==='Enter'){ e.preventDefault(); if(open&&SUG_I>=0&&items[SUG_I]) items[SUG_I].click(); else if(gs.value.trim()) goSearch(gs.value.trim()); return; }
    else if(e.key==='Escape'){ closeSuggest(); return; } else return;
    items.forEach((x,i)=>x.classList.toggle('on',i===SUG_I)); if(items[SUG_I]){ gs.setAttribute('aria-activedescendant',items[SUG_I].id); items[SUG_I].scrollIntoView({block:'nearest'}); }
  });
  /* Clavier global */
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ if(document.querySelector('.ctx-menu')) return; if(closeConfirm()) return; if($('#overlay').classList.contains('on')){ closeModal(); return; } if(closeDrawer()) return; closeDrops(); closeSuggest(); closeSidebar(); return; }
    if(e.key==='Tab'){ const c=$('#overlay2.on .modal')||($('#overlay').classList.contains('on')?$('#modal'):null)||($('#drawer').classList.contains('on')?$('#drawer'):null); if(c) trapFocus(c,e); return; }
    const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
    if(!$('#app').classList.contains('on')) return;
    if(!typing&&(e.key==='/'||(e.ctrlKey&&e.key.toLowerCase()==='k'))){ e.preventDefault(); gs.focus(); gs.select(); }
    else if(e.ctrlKey&&e.key.toLowerCase()==='k'){ e.preventDefault(); gs.focus(); gs.select(); }
    if(e.altKey&&e.key.toLowerCase()==='n'){ e.preventDefault(); docForm({preset:contextPreset()}); }
  });
  /* Glisser-déposer de fichiers n'importe où dans l'application */
  let dragDepth=0; const pd=$('#pageDrop');
  const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
  const canDrop=()=>$('#app').classList.contains('on')&&!$('#overlay').classList.contains('on');
  window.addEventListener('dragenter',e=>{ if(!hasFiles(e)||!canDrop()) return; dragDepth++; pd.classList.add('on'); });
  window.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) pd.classList.remove('on'); });
  window.addEventListener('dragover',e=>{ if(hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop',e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth=0; pd.classList.remove('on');
    if(!canDrop()) return; const files=[...e.dataTransfer.files]; if(CUR.view==='sauvegarde'&&files.length===1&&/\.(zip|odmx)$/i.test(files[0].name)) return restoreWizard(files[0]);
    if(files.length) docForm({preset:Object.assign(contextPreset(),{files})}); });
  /* Rafraîchissements (changement de jour, stockage, onglet revenu au premier plan) */
  let lastDay=todayISO();
  setInterval(()=>{ if(!$('#app').classList.contains('on')) return; if(todayISO()!==lastDay){ lastDay=todayISO(); rerender(); } refreshShellBadges(); },60000);
  setInterval(refreshStorage,300000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&$('#app').classList.contains('on')){ refreshShellBadges(); refreshStorage(); } });
  window.addEventListener('beforeunload',()=>{ for(const u of BLOB_URLS.keys()) URL.revokeObjectURL(u); });
}

(function(){
  if(!('BroadcastChannel' in window)) return;

  const orig=IDB.tx.bind(IDB);
  IDB.tx=function(names,mode,fn){ const p=orig(names,mode,fn); if(mode==='readwrite') p.then(()=>{ clearTimeout(t); t=setTimeout(()=>ch.postMessage({type:'changed',at:Date.now()}),250); }).catch(()=>{}); return p; };
