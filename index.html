/* Bouton « Retour en haut » sur toutes les pages, avec confirmation multi-sensorielle
   à l'arrivée : son Web Audio net + flash visuel + vibration (accessibilité malentendants). */
(function(){
  if(window.__ondeaToTop)return; window.__ondeaToTop=true;
  function build(){
    if(document.getElementById('toTopBtn'))return;
    var scroller=document.getElementById('main'); if(!scroller)return;

    var btn=document.createElement('button');
    btn.id='toTopBtn'; btn.type='button'; btn.title='Retour en haut';
    btn.setAttribute('aria-label','Retour en haut de la page');
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
    document.body.appendChild(btn);

    var flash=document.createElement('div');
    flash.id='toTopFlash'; flash.setAttribute('role','status'); flash.setAttribute('aria-live','assertive');
    flash.innerHTML='<span aria-hidden="true">⬆</span><span>Haut de page</span>';
    document.body.appendChild(flash);

    var armed=false, ac=null;
    function audio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume(); }catch(e){} return ac; }
    function chime(){
      var c=audio(); if(!c)return;
      try{
        var t=c.currentTime, master=c.createGain(); master.connect(c.destination);
        master.gain.setValueAtTime(0.0001,t);
        master.gain.exponentialRampToValueAtTime(0.9,t+0.02);
        master.gain.exponentialRampToValueAtTime(0.0001,t+0.95);
        [523.25,659.25,783.99].forEach(function(f,i){
          var o=c.createOscillator(),g=c.createGain(); o.type=i===0?'triangle':'sine'; o.frequency.value=f;
          o.connect(g); g.connect(master); var s=t+i*0.11;
          g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(1,s+0.015); g.gain.exponentialRampToValueAtTime(0.001,s+0.4);
          o.start(s); o.stop(s+0.45);
        });
        var lo=c.createOscillator(),lg=c.createGain(); lo.type='sine'; lo.frequency.value=196; lo.connect(lg); lg.connect(master);
        lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(0.75,t+0.02); lg.gain.exponentialRampToValueAtTime(0.001,t+0.5);
        lo.start(t); lo.stop(t+0.55);
      }catch(e){}
    }
    function arriveCue(){
      chime();
      if(navigator.vibrate){try{navigator.vibrate([120,60,120]);}catch(e){}}
      flash.classList.add('on'); btn.classList.add('arrived');
      setTimeout(function(){flash.classList.remove('on');},1000);
      setTimeout(function(){btn.classList.remove('arrived');},650);
    }
    function loggedIn(){ var a=document.getElementById('app'); return a&&a.classList.contains('on'); }
    function onScroll(){
      if(!loggedIn()){btn.classList.remove('show');return;}
      var y=scroller.scrollTop;
      btn.classList.toggle('show', y>240);
      if(armed && y<=2){armed=false; arriveCue();}
    }
    scroller.addEventListener('scroll',onScroll,{passive:true}); onScroll();
    btn.addEventListener('click',function(){
      audio();
      if(scroller.scrollTop<=2){arriveCue();return;}
      armed=true; scroller.scrollTo({top:0,behavior:'smooth'});
      setTimeout(function(){ if(armed && scroller.scrollTop<=2){armed=false; arriveCue();} },900);
    });
  }
  if(document.readyState!=='loading')build(); else document.addEventListener('DOMContentLoaded',build);
})();

    '<path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>',                        /* mot-clé */
    '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',                                                          /* recherche */
    '<path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/>',                                                        /* statistiques */
    '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',                             /* sauvegarde */
    '<path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M15 9h4a2 2 0 0 1 2 2v10"/>'                                /* entreprise */
  ];
  const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];

(function(){
  "use strict";
  if (window.__ondeaAvatarZoom) return; window.__ondeaAvatarZoom = true;

  var FACTOR = 3, MARGIN = 12, zoom = null, current = null;

  function close(){
    if (!zoom) return;
    var z = zoom; zoom = null; current = null;
    z.classList.remove("on");
    setTimeout(function(){ if (z.parentNode) z.parentNode.removeChild(z); }, 180);
  }

  function open(av){
    if (current === av) return;
    close();
    current = av;
    var r = av.getBoundingClientRect();
    var w = r.width * FACTOR, h = r.height * FACTOR;

    /* Centré sur l'avatar, mais toujours à l'intérieur de la fenêtre */
    var left = r.left + r.width / 2 - w / 2;
    var top  = r.top  + r.height / 2 - h / 2;
    left = Math.max(MARGIN, Math.min(left, window.innerWidth  - w - MARGIN));
    top  = Math.max(MARGIN, Math.min(top,  window.innerHeight - h - MARGIN));

    var z = av.cloneNode(true);
    z.removeAttribute("id");
    z.classList.add("av-zoom");
    z.setAttribute("aria-hidden", "true");
    z.style.width = w + "px"; z.style.height = h + "px";
    z.style.left = left + "px"; z.style.top = top + "px";
    z.style.fontSize = (parseFloat(getComputedStyle(av).fontSize) * FACTOR) + "px";

    /* Photo : reprend l'image déjà chargée (IndexedDB) */
    var srcImg = av.querySelector("img"), cloneImg = z.querySelector("img");
    if (srcImg && cloneImg && srcImg.src){ cloneImg.src = srcImg.src; cloneImg.removeAttribute("data-media"); }

    document.body.appendChild(z);
    zoom = z;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ if (zoom === z) z.classList.add("on"); }); });
  }

  document.addEventListener("mouseover", function(e){
    var av = e.target.closest && e.target.closest(".doc-thumb.is-img");
    if (av) open(av);
  });
  document.addEventListener("mouseout", function(e){
    if (!current) return;
    var to = e.relatedTarget;
    if (!to || !current.contains(to)) {
      var from = e.target.closest && e.target.closest(".doc-thumb.is-img");
      if (from === current) close();
    }
  });

  /* Fermeture si la page défile, change de vue ou si on appuie sur Échap */
  window.addEventListener("scroll", close, true);
  window.addEventListener("resize", close);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") close(); });
  document.addEventListener("click", close, true);
})();

  .kcol-b > .kcard:nth-child(2){ animation-delay:.06s; } .kcol-b > .kcard:nth-child(3){ animation-delay:.12s; }
  .kcol-b > .kcard:nth-child(n+4){ animation-delay:.18s; }

  /* ==================== GRAPHIQUES ==================== */
  .chart-bars .bar{
    transform-origin:bottom; animation:wx2BarY 1s var(--ease) both .3s;

  .chart-bars .bar-col:nth-child(2) .bar{ animation-delay:.38s; } .chart-bars .bar-col:nth-child(3) .bar{ animation-delay:.46s; }

  .chart-bars .bar-col:nth-child(6) .bar{ animation-delay:.70s; } .chart-bars .bar-col:nth-child(n+7) .bar{ animation-delay:.78s; }
  @keyframes wx2BarY{ from{ transform:scaleY(0); } }
  .chart-bars .bar:hover{ box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 0 30px var(--wx2-glow); }

  .donut{ animation:wx2Donut 1.6s var(--ease) both .3s; box-shadow:0 0 0 1px var(--or-line), 0 0 40px -6px var(--wx2-glow); }

  .stat-row:nth-child(4) .lbar > span{ animation-delay:.6s; } .stat-row:nth-child(n+5) .lbar > span{ animation-delay:.7s; }

  .prog > span{
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent) 0 0/40% 100% no-repeat, var(--wx-gold);
    animation:wx2Sheen 2.8s ease-in-out infinite;
  }
  @keyframes wx2Sheen{ 0%{ background-position:-60% 0, 0 0; } 70%,100%{ background-position:180% 0, 0 0; } }

  /* ==================== SURCOUCHES ==================== */
  .modal-h, .drawer-h{ position:relative; }
  .modal-h::after, .drawer-h::after{
    content:""; position:absolute; left:24px; right:24px; bottom:-1px; height:1px; pointer-events:none;

  }

  @keyframes wx2Modal{ from{ opacity:0; scale:.94; filter:blur(6px); } }

  .tab.active{ text-shadow:0 0 14px var(--wx2-glow); }

  .empty svg{ animation:wx2Float 4s ease-in-out infinite; filter:drop-shadow(0 8px 14px var(--wx2-glow-soft)); }

  .dropzone svg{ animation:wx2Float 3.2s ease-in-out infinite; }

  /* ==================== GARDE-FOUS ==================== */
  /* Contraste élevé : sobriété totale */
  html[data-contrast="high"] #login::before, html[data-contrast="high"] #login::after,
  html[data-contrast="high"] .login-box::before, html[data-contrast="high"] .nav-item::after,
  html[data-contrast="high"] .sb-widget::before, html[data-contrast="high"] .panel-h::after,

  html[data-contrast="high"] .topbar, html[data-contrast="high"] .sidebar{ background-image:none; animation:none; }

  /* Impression */
  @media print{
    #login::before, #login::after, .login-box::before, .toast::after{ display:none !important; }
    .topbar, .sidebar{ background-image:none !important; }
    .page-head h2{ background:none !important; color:#000 !important; filter:none !important; }
  }
</style>


<script>
  (function () {
    function updateClock() {
      const clockElement = document.getElementById('realtime-clock');
      if (!clockElement) return;

      const now = new Date();
      // Formatage français HH:mm:ss
      const formattedTime = now.toLocaleTimeString('fr-FR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });

      clockElement.textContent = formattedTime;
      clockElement.setAttribute('datetime', now.toISOString());
    }

    // Mise à jour immédiate puis toutes les secondes
    document.addEventListener('DOMContentLoaded', function () {
      updateClock();
      setInterval(updateClock, 1000);
    });
  })();
</script>
