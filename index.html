async function saveFolder(f){ f.updatedAt=Date.now(); await IDB.put('folders',f); S.folders.set(f.id,f); return f; }
function folderChildren(pid){ return allFolders().filter(f=>(f.parentId||null)===(pid||null)).sort((a,b)=>a.name.localeCompare(b.name,'fr')); }
function folderPath(id){ const out=[]; let f=folderById(id), guard=0; while(f&&guard++<50){ out.unshift(f); f=folderById(f.parentId); } return out; }
function folderPathLabel(id){ return id&&folderById(id)?folderPath(id).map(f=>f.name).join(' › '):'Racine (aucun dossier)'; }
function folderDescendants(id){ const out=[]; const walk=p=>folderChildren(p).forEach(c=>{out.push(c.id);walk(c.id);}); walk(id); return out; }
function folderDocCount(id,deep=false){ const ids=deep?[id,...folderDescendants(id)]:[id]; return liveDocs().filter(d=>!d.archived&&ids.includes(d.folderId)).length; }
/* Options <select> hiérarchiques des dossiers (indentées) */
function folderOptions(sel,{exclude=[],rootLabel='— Aucun dossier (racine) —'}={}){

/* ---------- Journal d'activité ---------- */

/* ---------- Chargement complet depuis IndexedDB ---------- */

/* ============================================================
   MODULE 3 — RÈGLES MÉTIER : CONTRATS, FACTURES, DEVIS, ÉCHÉANCES
   Tous les statuts « automatiques » sont CALCULÉS à partir des dates
   réellement saisies et de la date du jour — jamais simulés.
   Rappel : il s'agit d'un outil de classement et de suivi documentaire,
   pas d'un logiciel comptable certifié ni d'un conseil juridique.
   ============================================================ */

/* ---------- Contrats ---------- */
const CONTRACT_KINDS=[['client','Contrat client'],['fournisseur','Contrat fournisseur'],['prestation','Contrat de prestation'],['maintenance','Contrat de maintenance'],['location','Contrat de location'],['partenariat','Contrat de partenariat'],['autre','Autre contrat']];
const CONTRACT_STATUS={
  brouillon:{label:'Brouillon',cls:''}, attente:{label:'En attente de signature',cls:'warn'},
  actif:{label:'Actif',cls:'ok'}, echu:{label:'Arrivé à échéance',cls:'dng'},
  resilie:{label:'Résilié',cls:''}, archive:{label:'Archivé',cls:''}
};
function blankContract(){ return {kind:'client',number:'',counterparty:'',signDate:'',startDate:'',endDate:'',renewalDate:'',noticeValue:null,noticeUnit:'mois',tacitRenewal:false,amount:null,amountPeriod:'total',currency:'EUR',status:'brouillon'}; }
/* Statut effectif : un contrat « actif » dont la date de fin est dépassée devient « arrivé à échéance » */
function contractStatusKey(c){ if(!c) return 'brouillon'; if(c.status==='actif'&&c.endDate&&daysUntil(c.endDate)<0) return 'echu'; return c.status||'brouillon'; }
/* Date limite de préavis = (date de renouvellement ou de fin) − durée de préavis saisie.
   Aucune obligation juridique n'est déduite : seul le paramétrage saisi est utilisé. */
function contractNotice(c){
  if(!c) return null;
  const base=c.renewalDate||c.endDate; const v=Number(c.noticeValue);
  if(!base||!v||v<=0) return null;
  const d=parseISO(base);
  if(c.noticeUnit==='mois'){ const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()-v); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); }
  else d.setDate(d.getDate()-v);
  const deadline=isoLocal(d);
  return {base,deadline,days:daysUntil(deadline),label:`${v} ${c.noticeUnit==='mois'?'mois':'jour'+(v>1?'s':'')}`};
}

/* ---------- Factures ---------- */
const INVOICE_STATUS={
  apayer:{label:'À payer',cls:'info'}, payee:{label:'Payée',cls:'ok'}, partielle:{label:'Partiellement payée',cls:'warn'},
  retard:{label:'En retard',cls:'dng'}, annulee:{label:'Annulée',cls:''}, archivee:{label:'Archivée',cls:''}
};
function blankInvoice(){ return {direction:'client',number:'',issuer:'',recipient:'',issueDate:'',dueDate:'',ht:null,tva:null,ttc:null,currency:'EUR',payments:[],manualStatus:null}; }
/* Calcul cohérent des montants : TTC = HT + TVA ; TVA = TTC − HT si non saisie */
function invoiceAmounts(i){
  if(!i) return {ht:null,tva:null,ttc:null,paid:0,balance:null,coherent:true};
  let {ht,tva,ttc}=i; ht=ht??null; tva=tva??null; ttc=ttc??null;
  if(ttc===null&&ht!==null) ttc=round2(ht+(tva||0));
  if(tva===null&&ht!==null&&ttc!==null) tva=round2(ttc-ht);
  const coherent=!(i.ht!=null&&i.tva!=null&&i.ttc!=null)||Math.abs(round2(i.ht+i.tva)-i.ttc)<0.011;
  const paid=round2((i.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0));
  const balance=ttc===null?null:round2(ttc-paid);
  return {ht,tva,ttc,paid,balance,coherent};
}
function invoiceStatusKey(i){
  if(!i) return 'apayer';
  if(i.manualStatus==='annulee'||i.manualStatus==='archivee') return i.manualStatus;
  const a=invoiceAmounts(i);
  if(a.ttc!==null&&a.ttc>0&&a.balance<=0) return 'payee';
  if(i.dueDate&&daysUntil(i.dueDate)<0) return 'retard';
  if(a.paid>0) return 'partielle';
  return 'apayer';
}

/* ---------- Devis ---------- */
const QUOTE_STATUS={
  brouillon:{label:'Brouillon',cls:''}, envoye:{label:'Envoyé',cls:'info'}, accepte:{label:'Accepté',cls:'ok'},
  refuse:{label:'Refusé',cls:'dng'}, expire:{label:'Expiré',cls:'warn'}, commande:{label:'Transformé en commande',cls:'gold'}
};
function blankQuote(){ return {number:'',client:'',issueDate:'',validUntil:'',ht:null,tva:null,ttc:null,currency:'EUR',status:'brouillon',links:{contractId:null,orderId:null,invoiceId:null}}; }
/* Un devis brouillon/envoyé dont la date de validité est dépassée est automatiquement « expiré » */
function quoteStatusKey(q){ if(!q) return 'brouillon'; if((q.status==='envoye'||q.status==='brouillon')&&q.validUntil&&daysUntil(q.validUntil)<0) return 'expire'; return q.status||'brouillon'; }

/* ---------- Statut unifié d'un document (affichage) ---------- */
function docStatus(d){
  if(d.trashed) return {key:'trash',label:'Corbeille',cls:'dng'};
  if(d.archived) return {key:'archived',label:'Archivé',cls:''};
  if(d.category==='contrat'&&d.contract){ const k=contractStatusKey(d.contract); return Object.assign({key:k},CONTRACT_STATUS[k]); }
  if(d.category==='facture'&&d.invoice){ const k=invoiceStatusKey(d.invoice); return Object.assign({key:k},INVOICE_STATUS[k]); }
  if(d.category==='devis'&&d.quote){ const k=quoteStatusKey(d.quote); return Object.assign({key:k},QUOTE_STATUS[k]); }
  const s=d.status||'—'; const cls=/traiter|compl/i.test(s)?'warn':/valid|class/i.test(s)?'ok':/cours/i.test(s)?'info':'';
  return {key:s,label:s,cls};
}
function docAmount(d){
  if(d.category==='facture'&&d.invoice){ const a=invoiceAmounts(d.invoice); return a.ttc!==null?{v:a.ttc,cur:d.invoice.currency}:null; }
  if(d.category==='devis'&&d.quote){ const a=invoiceAmounts(d.quote); return a.ttc!==null?{v:a.ttc,cur:d.quote.currency}:null; }
  if(d.category==='contrat'&&d.contract&&d.contract.amount!=null) return {v:d.contract.amount,cur:d.contract.currency};
  return null;
}
/* Recopie les champs métier vers les champs communs (tiers, référence, dates) pour la liste et la recherche */
function syncBusinessFields(d){
  if(d.category==='contrat'&&d.contract){ const c=d.contract; d.reference=c.number||d.reference; d.party=c.counterparty||d.party; d.issueDate=c.signDate||c.startDate||d.issueDate; d.dueDate=c.endDate||''; }
  if(d.category==='facture'&&d.invoice){ const i=d.invoice; d.reference=i.number||d.reference; d.party=(i.direction==='fournisseur'?i.issuer:i.recipient)||d.party; d.issueDate=i.issueDate||d.issueDate; d.dueDate=i.dueDate||''; }
  if(d.category==='devis'&&d.quote){ const q=d.quote; d.reference=q.number||d.reference; d.party=q.client||d.party; d.issueDate=q.issueDate||d.issueDate; d.dueDate=q.validUntil||''; }
  return d;
}
/* Raisons pour lesquelles un document est « à compléter / à traiter » */
function docAttention(d){
  const r=[];
  if(/traiter/i.test(d.status||'')) r.push('Statut « À traiter »');
  if(/compl/i.test(d.status||'')) r.push('Statut « À compléter »');
  if(!d.fileId) r.push('Fichier original absent');
  if(d.category==='facture'&&d.invoice){ const a=invoiceAmounts(d.invoice); if(a.ttc===null) r.push('Montant TTC non renseigné'); if(!d.invoice.dueDate) r.push("Date d'échéance manquante"); if(!a.coherent) r.push('HT + TVA ≠ TTC'); }
  if(d.category==='contrat'&&d.contract){ if(!d.contract.endDate&&!d.contract.tacitRenewal&&d.contract.status==='actif') r.push('Date de fin non renseignée'); }
  if(d.category==='devis'&&d.quote){ if(!d.quote.validUntil) r.push('Date de validité manquante'); }
  return r;
}
const needsAttention = d=>docAttention(d).length>0;

/* ============================================================
   CENTRE DES ÉCHÉANCES — calcul des alertes
   Chaque alerte possède un identifiant stable : docId|type|date.
   Si la date change, une nouvelle alerte est générée.
   ============================================================ */
const ALERT_KIND={
  contract_end:{label:'Fin de contrat',icon:'contract'},
  contract_renewal:{label:'Renouvellement à préparer',icon:'restore'},
  contract_notice:{label:'Délai de préavis',icon:'clock'},
  invoice_pay:{label:'Facture fournisseur à payer',icon:'invoice'},
  invoice_collect:{label:'Facture client à encaisser',icon:'invoice'},
  quote_expiry:{label:'Devis bientôt expiré',icon:'quote'},
  quote_expired:{label:'Devis expiré sans réponse',icon:'quote'},
  insurance:{label:'Assurance à renouveler',icon:'shield'},
  admin:{label:'Document administratif à actualiser',icon:'building'},
  doc_due:{label:'Échéance de document',icon:'cal'}
};
function reminderFor(d,kind){ const r=S.settings.reminders; if(d.reminderDays!=null&&d.reminderDays!=='') return Number(d.reminderDays); return Number(r[kind]??r.autre??15); }
function alertLevel(days){ return days<0?'dng':days<=7?'warn':'info'; }
function computeAlerts({includeHandled=false}={}){
  const out=[]; const T=todayISO();
  const push=(d,kind,date,remind,text,{minDays=-3650}={})=>{
    if(!date) return; const days=daysUntil(date);
    if(days>remind||days<minDays) return;
    const id=`${d.id}|${kind}|${date}`; const st=S.alertStates[id]||null;
    if(st&&!includeHandled) return;
    out.push({id,docId:d.id,kind,date,days,level:alertLevel(days),text,title:d.title,party:d.party,state:st?st.s:null,ignorable:days>=0||kind==='quote_expired'||kind==='contract_notice'});
  };
  activeDocs().forEach(d=>{
    if(d.category==='contrat'&&d.contract){
      const c=d.contract, k=contractStatusKey(c);
      if(k==='actif'||k==='echu'){
        push(d,'contract_end',c.endDate,reminderFor(d,'contrat'),k==='echu'?'Contrat arrivé à échéance : à renouveler, résilier ou archiver':'Le contrat arrive à échéance');
        push(d,'contract_renewal',c.renewalDate,reminderFor(d,'contrat'),'Renouvellement à préparer');
        const n=contractNotice(c); if(n) push(d,'contract_notice',n.deadline,reminderFor(d,'preavis'),n.days<0?`Date limite de préavis dépassée (préavis de ${n.label})`:`Dernier jour pour notifier le préavis (${n.label})`,{minDays:-30});
      }
    } else if(d.category==='facture'&&d.invoice){
      const k=invoiceStatusKey(d.invoice);
      if(['apayer','partielle','retard'].includes(k)){ const a=invoiceAmounts(d.invoice);
        const sold=a.balance!==null?` — solde ${fmtMoney(a.balance,d.invoice.currency)}`:'';
        push(d,d.invoice.direction==='fournisseur'?'invoice_pay':'invoice_collect',d.invoice.dueDate,reminderFor(d,'facture'),(k==='retard'?'Facture en retard de paiement':'Échéance de paiement')+sold); }
    } else if(d.category==='devis'&&d.quote){
      const q=d.quote;
      if(q.status==='envoye'||q.status==='brouillon'){
        if(q.validUntil&&daysUntil(q.validUntil)<0) push(d,'quote_expired',q.validUntil,0,'Devis expiré sans réponse du client',{minDays:-60});
        else push(d,'quote_expiry',q.validUntil,reminderFor(d,'devis'),'Le devis arrive à expiration');
      }
    } else if(d.dueDate){
      const kind=d.category==='assurance'?'insurance':d.category==='administratif'?'admin':'doc_due';
      const rk=d.category==='assurance'?'assurance':d.category==='administratif'?'administratif':'autre';
      push(d,kind,d.dueDate,reminderFor(d,rk),kind==='insurance'?(daysUntil(d.dueDate)<0?"Attestation d'assurance expirée":"Attestation d'assurance à renouveler"):kind==='admin'?(daysUntil(d.dueDate)<0?'Document administratif expiré':'Document administratif à actualiser'):'Date d\'échéance du document');
    }
  });
  return out.sort((a,b)=>a.days-b.days);
}
async function setAlertState(id,s){
  if(s) S.alertStates[id]={s,at:Date.now()}; else delete S.alertStates[id];
  await IDB.setMeta('alertStates',S.alertStates);
}
/* Notifications système (sauvegarde non faite, stockage presque plein) */
let STORAGE_EST=null;
function systemNotices(){
  const out=[]; const b=S.settings.backup; const n=liveDocs().length;
  if(n>0){
    const last=b.lastBackupAt; const days=last?Math.floor((Date.now()-last)/86400000):null;
    if(!last||days>=Number(b.reminderDays||7)){
      const id='sys|backup|'+todayISO();
      if(!S.alertStates[id]) out.push({id,sys:true,kind:'backup',level:'warn',text:last?`Dernière sauvegarde complète il y a ${days} jours. Pensez à sauvegarder vos documents sur un support externe.`:'Aucune sauvegarde complète n\'a encore été réalisée. Vos documents ne sont stockés que dans ce navigateur.',ignorable:true});
    }
  }
  if(STORAGE_EST&&STORAGE_EST.quota&&STORAGE_EST.usage/STORAGE_EST.quota>0.8){
    const id='sys|quota|'+todayISO();
    if(!S.alertStates[id]) out.push({id,sys:true,kind:'quota',level:'dng',text:`Espace de stockage du navigateur utilisé à ${Math.round(STORAGE_EST.usage/STORAGE_EST.quota*100)} %. Libérez de l'espace ou archivez vers un support externe.`,ignorable:true});
  }
  return out;
}

/* ============================================================
   MODULE 4 — FICHIERS : types, empreintes, miniatures, URL Blob
   ============================================================ */
/* Formats acceptés (extension → famille d'icône, type MIME de repli) */
const FILE_TYPES={
  pdf:['pdf','application/pdf'],
  doc:['doc','application/msword'], docx:['doc','application/vnd.openxmlformats-officedocument.wordprocessingml.document'],
  odt:['doc','application/vnd.oasis.opendocument.text'], rtf:['doc','application/rtf'],
  xls:['xls','application/vnd.ms-excel'], xlsx:['xls','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'],
  ods:['xls','application/vnd.oasis.opendocument.spreadsheet'], csv:['xls','text/csv'],
  ppt:['doc','application/vnd.ms-powerpoint'], pptx:['doc','application/vnd.openxmlformats-officedocument.presentationml.presentation'], odp:['doc','application/vnd.oasis.opendocument.presentation'],
  txt:['txt','text/plain'], md:['txt','text/markdown'], json:['txt','application/json'], xml:['txt','application/xml'],
  jpg:['img','image/jpeg'], jpeg:['img','image/jpeg'], png:['img','image/png'], webp:['img','image/webp'], gif:['img','image/gif'], bmp:['img','image/bmp'], tif:['img','image/tiff'], tiff:['img','image/tiff'], heic:['img','image/heic'],
  zip:['txt','application/zip'], eml:['txt','message/rfc822'], msg:['txt','application/vnd.ms-outlook']
};
/* Extensions refusées (exécutables, scripts) — protection de l'utilisateur */
const BLOCKED_EXT=['exe','msi','bat','cmd','com','scr','ps1','vbs','vbe','js','jse','wsf','wsh','hta','cpl','dll','jar','lnk','reg','sh','app','apk'];
const ACCEPT_ATTR=Object.keys(FILE_TYPES).map(e=>'.'+e).join(',');
const extOf = n=>{ const m=/\.([a-z0-9]{1,6})$/i.exec(n||''); return m?m[1].toLowerCase():''; };
function fileFamily(nameOrType,type=''){ const e=extOf(nameOrType); if(FILE_TYPES[e]) return FILE_TYPES[e][0]; if(/^image\//.test(type)) return 'img'; if(/pdf/.test(type)) return 'pdf'; if(/^text\//.test(type)) return 'txt'; return 'txt'; }
function mimeOf(name,type){ if(type) return type; const e=extOf(name); return FILE_TYPES[e]?FILE_TYPES[e][1]:'application/octet-stream'; }
function validateFile(f){
  const e=extOf(f.name);
  if(BLOCKED_EXT.includes(e)) return `Type de fichier refusé pour votre sécurité (.${e} : programme ou script exécutable).`;
  if(!FILE_TYPES[e]) return `Format non pris en charge (.${e||'sans extension'}). Formats acceptés : PDF, Word, Excel, CSV, TXT, images (JPG, PNG, WEBP)…`;
  if(f.size===0) return 'Le fichier est vide (0 octet).';
  return null;
}
/* Icône de type de fichier (ou miniature pour les images) */
function fileIconHTML(d,size=''){
  if(d.thumb) return `<div class="doc-thumb is-img ${size}"><img src="${esc(d.thumb)}" alt=""></div>`;
  if(!d.fileId) return `<div class="ftype none ${size}" title="Aucun fichier associé">${svg(catByKey(d.category).icon||'file')}</div>`;
  const fam=fileFamily(d.fileName,d.fileType), e=extOf(d.fileName);
  const ic=fam==='img'?'image':fam==='xls'?'table':fam==='pdf'?'fileText':'file';
  return `<div class="ftype ${fam} has-ext ${size}" title="${esc(e.toUpperCase())}">${svg(ic)}<span class="ext">${esc(e.toUpperCase().slice(0,4))}</span></div>`;
}

/* ---------- CRC-32 (contrôle d'intégrité des archives ZIP) ---------- */
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(buf,crc=0){ const u=buf instanceof Uint8Array?buf:new Uint8Array(buf); let c=(crc^0xFFFFFFFF)>>>0; for(let i=0;i<u.length;i++) c=CRC_TABLE[(c^u[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
/* CRC-32 d'un Blob, par blocs (mémoire maîtrisée pour les gros fichiers) */
async function crc32Blob(blob,onProg){ let c=0; const CH=8*1024*1024; for(let o=0;o<blob.size;o+=CH){ const b=new Uint8Array(await blob.slice(o,o+CH).arrayBuffer()); c=crc32(b,c); if(onProg) onProg(Math.min(1,(o+CH)/blob.size)); } return c>>>0; }

/* ---------- Empreinte SHA-256 (détection des doublons) ----------
   Calculée localement avec Web Crypto. Au-delà de 512 Mo, une empreinte
   rapide (taille + CRC-32 du début et de la fin) est utilisée pour préserver la mémoire. */
const hex = buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
async function hashBlob(blob,onProg){
  const big=blob.size>512*1024*1024;
  if(!big&&window.crypto&&crypto.subtle){
    const buf=await readWithProgress(blob,onProg);
    const h=await crypto.subtle.digest('SHA-256',buf);
    return {hash:hex(h),algo:'SHA-256'};
  }
  const CH=4*1024*1024; const a=await crc32Blob(blob.slice(0,CH)); const b=await crc32Blob(blob.slice(Math.max(0,blob.size-CH)));
  if(onProg) onProg(1);
  return {hash:`q-${blob.size}-${a.toString(16)}-${b.toString(16)}`,algo:'rapide'};
}
function readWithProgress(blob,onProg){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onprogress=e=>{ if(onProg&&e.lengthComputable) onProg(e.loaded/e.total); };
    r.onload=()=>res(r.result); r.onerror=()=>rej(r.error||new Error('Lecture impossible')); r.readAsArrayBuffer(blob); });
}
/* ---------- Miniature (images uniquement, ~ 10 Ko en JPEG) ---------- */
async function makeThumb(blob){
  if(!/^image\/(png|jpe?g|webp|gif|bmp)$/i.test(blob.type)||blob.size>40*1024*1024) return null;
  const url=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const S_=160, r=Math.max(img.width,img.height)||1, w=Math.max(1,Math.round(img.width*S_/r)), h=Math.max(1,Math.round(img.height*S_/r));
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
    return c.toDataURL('image/jpeg',.72);
  }catch(e){ return null; } finally{ URL.revokeObjectURL(url); }
}
/* ---------- Indexation du texte (TXT / CSV / MD uniquement, 200 Ko max) ----------
   Les PDF et fichiers bureautiques ne sont PAS indexés : la recherche porte sur leurs métadonnées. */
async function extractText(blob,name){
  const e=extOf(name); if(!['txt','csv','md','json','xml'].includes(e)||blob.size>5*1024*1024) return '';
  try{ return (await blob.slice(0,200*1024).text()).slice(0,200000); }catch(err){ return ''; }
}

/* ---------- Registre des URL Blob (libération garantie) ---------- */
const BLOB_URLS=new Map();  // url -> étiquette
function blobURL(blob,tag='misc'){ const u=URL.createObjectURL(blob); BLOB_URLS.set(u,tag); return u; }
function revokeURL(u){ if(u&&BLOB_URLS.has(u)){ URL.revokeObjectURL(u); BLOB_URLS.delete(u); } }
function revokeTag(tag){ for(const [u,t] of BLOB_URLS) if(t===tag){ URL.revokeObjectURL(u); BLOB_URLS.delete(u); } }
window.__odmBlobURLs=BLOB_URLS; // contrôle par les tests
/* Téléchargement d'un Blob (URL libérée après usage) */
function downloadBlob(blob,name){
  const u=blobURL(blob,'dl'); const a=document.createElement('a'); a.href=u; a.download=safeFileName(name); a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>revokeURL(u),15000);
}

/* ---------- Générateur PDF minimal (données de démonstration uniquement) ----------
   Produit un PDF 1.4 valide, texte Helvetica, encodage WinAnsi (accents français). */
function makeDemoPdf(title,lines){
  const WIN={'€':0x80,'’':0x92,'‘':0x91,'“':0x93,'”':0x94,'–':0x96,'—':0x97,'…':0x85,'œ':0x9C,'Œ':0x8C};
  const enc=s=>{ const out=[]; for(const ch of String(s)){ let c=ch.charCodeAt(0); if(WIN[ch]!==undefined) c=WIN[ch]; else if(c>255) c=63; if(c===40||c===41||c===92){ out.push(92); } out.push(c); } return out; };
  let content=[];
  const txt=(x,y,size,s,font='F1')=>{ content.push(...[...`BT /${font} ${size} Tf ${x} ${y} Td (`].map(c=>c.charCodeAt(0)),...enc(s),...[...`) Tj ET\n`].map(c=>c.charCodeAt(0))); };
  const raw=s=>content.push(...[...s].map(c=>c.charCodeAt(0)));
  raw('0.79 0.64 0.29 rg 0 800 595 42 re f\n');
  txt(40,812,11,'ONDEA DOCS MANAGER — DOCUMENT DE DÉMONSTRATION FICTIF','F2');
  raw('0.1 0.1 0.12 rg\n');
  txt(40,760,20,title,'F2');
  let y=725; lines.forEach(l=>{ if(y<60) return; txt(40,y,11,l); y-=18; });
  raw('0.6 0.6 0.6 rg\n'); txt(40,40,8,'Document généré automatiquement pour la découverte de l’application. Aucune valeur juridique ou comptable. Données fictives.');
  const objs=[];
  objs.push('<< /Type /Catalog /Pages 2 0 R >>');
  objs.push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>');
  objs.push(null); // flux de contenu
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const bytes=[]; const push=s=>{ for(const c of s) bytes.push(c.charCodeAt(0)); };
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'); const offs=[];
  objs.forEach((o,i)=>{ offs.push(bytes.length); push(`${i+1} 0 obj\n`);
    if(o===null){ push(`<< /Length ${content.length} >>\nstream\n`); bytes.push(...content); push('\nendstream'); } else push(o);
    push('\nendobj\n'); });
  const xref=bytes.length; push(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`);
  offs.forEach(o=>push(String(o).padStart(10,'0')+' 00000 n \n'));
  push(`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob([new Uint8Array(bytes)],{type:'application/pdf'});
}
/* Image de démonstration (attestation « scannée » fictive) générée sur canvas */
function makeDemoImage(title,lines,color='#c9a24b'){
  return new Promise(res=>{
    const c=document.createElement('canvas'); c.width=900; c.height=1200; const x=c.getContext('2d');
    x.fillStyle='#fbf9f4'; x.fillRect(0,0,900,1200); x.fillStyle=color; x.fillRect(0,0,900,90);
    x.fillStyle='#12140f'; x.font='bold 28px Georgia,serif'; x.fillText('DOCUMENT FICTIF — DÉMONSTRATION',40,56);

/* ---------- Toasts ---------- */
function toast(msg,type='ok',ms=3600){
  const el=document.createElement('div');el.className='toast '+type;
  el.setAttribute('role',type==='dng'?'alert':'status');
  const ic=type==='ok'?'check':type==='dng'?'warn':type==='warn'?'warn':'info';
  el.innerHTML=`<span class="ic">${svg(ic)}</span><span class="msg">${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},ms);
}
function srSay(msg){ const l=$('#srLive'); if(l){ l.textContent=''; setTimeout(()=>l.textContent=msg,40); } }

/* ---------- Thème clair / sombre (identique à Ondea Staff) ---------- */
function applyTheme(t){
  document.documentElement.dataset.theme=t; PREFS.theme=t; PREFS.save();
  const next=t==='dark'?'light':'dark', icon=t==='dark'?'sun':'moon';

/* ---------- Contraste élevé ---------- */
function applyContrast(on){

  const b=$('#contrastBtn'); if(b){ b.setAttribute('aria-pressed',on?'true':'false'); b.classList.toggle('on',on); b.title=on?'Contraste élevé : activé (cliquer pour revenir à la normale)':'Contraste élevé'; }
  refreshDispPanel();

/* ---------- Taille du texte : 90 % → 150 % (toute l'interface, rem) ---------- */
const FS_STEPS=[.9,1,1.1,1.2,1.35,1.5];
function applyFontScale(v){
  v=clamp(Number(v)||1,FS_STEPS[0],FS_STEPS[FS_STEPS.length-1]);
  document.documentElement.style.setProperty('--fs',v); document.documentElement.dataset.fsl=v>=1.3?'1':''; PREFS.fs=v; PREFS.save(); refreshDispPanel();
}
function stepFont(dir){ const i=FS_STEPS.findIndex(s=>Math.abs(s-PREFS.fs)<.001); const ni=clamp((i<0?1:i)+dir,0,FS_STEPS.length-1); applyFontScale(FS_STEPS[ni]); srSay(`Taille du texte : ${Math.round(FS_STEPS[ni]*100)} %`); }

/* ---------- Modale générique + seconde couche de confirmation ---------- */
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),iframe,[tabindex]:not([tabindex="-1"])';
function trapFocus(container,e){
  const f=$$(FOCUSABLE,container).filter(x=>x.offsetParent!==null||x===document.activeElement);
  if(!f.length) return; const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
}
let MODAL_RETURN=null, MODAL_ONCLOSE=null;
function openModal({title,body,footer='',size='',onOpen,onClose}){
  const m=$('#modal'); if(!$('#overlay').classList.contains('on')) MODAL_RETURN=document.activeElement;
  if(MODAL_ONCLOSE){ const f=MODAL_ONCLOSE; MODAL_ONCLOSE=null; try{f();}catch(e){} }
  m.className='modal'+(size?' '+size:'');
  m.innerHTML=`<div class="modal-h"><h3 id="modalTitle">${esc(title)}</h3><button class="x-btn" data-close aria-label="Fermer la fenêtre">${svg('x')}</button></div>
    <div class="modal-b">${body}</div>${footer?`<div class="modal-f">${footer}</div>`:''}`;
  $('#overlay').classList.add('on');
  MODAL_ONCLOSE=onClose||null;
  $$('[data-close]',m).forEach(b=>b.onclick=closeModal);
  if(onOpen) onOpen(m);
  setTimeout(()=>{ const f=m.querySelector('[autofocus]')||m.querySelector('.modal-b '+FOCUSABLE)||m.querySelector(FOCUSABLE); if(f) f.focus(); },60);
  return m;
}
function closeModal(){
  if(!$('#overlay').classList.contains('on')) return;
  $('#overlay').classList.remove('on');
  if(MODAL_ONCLOSE){ const f=MODAL_ONCLOSE; MODAL_ONCLOSE=null; try{f();}catch(e){} }
  setTimeout(()=>{ if(!$('#overlay').classList.contains('on')) $('#modal').innerHTML=''; },300);
  if(MODAL_RETURN&&document.contains(MODAL_RETURN)) try{MODAL_RETURN.focus();}catch(e){}
}
/* Confirmation : couche supérieure indépendante (peut s'afficher au-dessus d'une modale) */
function confirmDialog(msg,onYes,{danger=true,yes='Confirmer',title='Confirmation',typed=null,html=false}={}){

    ov.addEventListener('click',e=>{ if(e.target===ov) closeConfirm(); }); }
  const ret=document.activeElement; const m=ov.firstChild;

    <div class="modal-f"><button class="btn ghost" data-cclose>Annuler</button><button class="btn ${danger?'danger':'gold'}" id="cfmYes" ${typed?'disabled':''}>${esc(yes)}</button></div>`;

function badgeInfo(kind){
  if(kind==='all') return {n:activeDocs().length,cls:''};
  if(kind==='contrats'){ const n=computeAlerts().filter(a=>a.kind.startsWith('contract')).length; return {n,cls:'red'}; }
  if(kind==='factures'){ const n=activeDocs().filter(d=>d.category==='facture'&&d.invoice&&invoiceStatusKey(d.invoice)==='retard').length; return {n,cls:'red'}; }
  if(kind==='devis'){ const n=activeDocs().filter(d=>d.category==='devis'&&d.quote&&quoteStatusKey(d.quote)==='envoye').length; return {n,cls:''}; }
  if(kind==='due'){ const a=computeAlerts(); return {n:a.length,cls:a.some(x=>x.level==='dng')?'red':''}; }
  if(kind==='trash') return {n:allDocs().filter(d=>d.trashed).length,cls:''};
  if(kind==='backup'){ const n=systemNotices().filter(x=>x.kind==='backup').length; return {n,cls:'red',txt:'!'}; }
  return {n:0};
}
function badgeTitle(kind,n){ return ({all:`${n} documents actifs`,contrats:`${n} alerte(s) contrat`,factures:`${n} facture(s) en retard`,devis:`${n} devis envoyé(s) en attente`,due:`${n} échéance(s) à surveiller`,trash:`${n} document(s) dans la corbeille`,backup:'Sauvegarde recommandée'})[kind]||''; }

function refreshShellBadges(){
  $$('#sbNav .nav-item').forEach(b=>{
    const it=navModel().find(x=>x.id===b.dataset.view); let bd=b.querySelector('.badge');
    const info=it&&it.badge?badgeInfo(it.badge):{n:0};

    else if(bd) bd.remove();
  });

const refreshStorageSoon=debounce(()=>refreshStorage(),1500);

function markActiveNav(){ const v=CUR.view; $$('#sbNav .nav-item').forEach(b=>{ const on=b.dataset.view===v; b.classList.toggle('active',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); }

const VIEWS={}; window.VIEWS=VIEWS;
const VIEW_STATE={};          // états conservés par rubrique
const CUR={view:'dashboard',params:{}};
/* Récupère l'état conservé d'une rubrique en complétant les clés manquantes par les valeurs par défaut */
function vstate(v,def={}){ const s=VIEW_STATE[v]||(VIEW_STATE[v]={}); for(const k of Object.keys(def)) if(s[k]===undefined) s[k]=structuredClone(def[k]); return s; }
function navigate(view,params={}){
  CUR.params=params||{};
  const h='#/'+view;
  if(location.hash!==h){ location.hash=h; /* hashchange → render */ }
  else render();
}
function render(){
  const h=decodeURIComponent(location.hash||'');
  let view=h.startsWith('#/')?h.slice(2):'dashboard';
  if(!VIEWS[view]&&!view.startsWith('cat:')) view='dashboard';
  if(view.startsWith('cat:')&&!cats().find(c=>c.key===view.slice(4))) view='documents';
  const changed=CUR.view!==view; CUR.view=view;
  markActiveNav();
  revokeTag('view');
  const main=$('#main'); main.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='view'; main.appendChild(wrap);
  try{ (view.startsWith('cat:')?VIEWS.category:VIEWS[view])(wrap,CUR.params); }
  catch(e){ console.error(e); wrap.innerHTML=`<div class="empty">${svg('warn')}<h4>Erreur d'affichage</h4><p>${esc(e.message)}</p></div>`; }
  if(changed) main.scrollTop=0;
  CUR.params={};
  document.title=(navModel().find(x=>x.id===view)?.label||(view==='recherche'?'Recherche':'Ondea Docs'))+' — Ondea Docs Manager';
}
/* Ré-affiche la vue courante en conservant la position de défilement */
function rerender(){ const m=$('#main'); const y=m.scrollTop; const keep=CUR.params; render(); m.scrollTop=y; CUR.params=keep; refreshShellBadges(); }
window.addEventListener('hashchange',()=>{ if(!$('#app').classList.contains('on')) return; if(!(location.hash||'').startsWith('#/')) return; render(); });

function pageHead(title,sub,actions=''){
  return `<div class="page-head"><div><div class="eyebrow">${esc(sub||'')}</div><h2>${esc(title)}</h2></div><div class="row wrap">${actions}</div></div>`;
}
/* Pagination (reprise du composant Ondea) */
function pagerHTML(page,pages,total,start,shown,unit='document'){
  if(!total) return '';
  if(pages<=1) return `<div class="pager"><span class="pager-info">${plural(total,unit)}</span></div>`;
  let nums='';
  for(let i=1;i<=pages;i++){
    if(i===1||i===pages||Math.abs(i-page)<=1) nums+=`<button class="${i===page?'on':''}" data-pg="${i}" aria-label="Page ${i}" ${i===page?'aria-current="page"':''}>${i}</button>`;
    else if(i===page-2||i===page+2) nums+='<span class="pager-dots">…</span>';
  }
  return `<nav class="pager" aria-label="Pagination"><span class="pager-info">${start+1}–${start+shown} sur ${total}</span>
    <div class="pager-ctrls"><button data-pg="prev" ${page===1?'disabled':''}>‹ Préc.</button>${nums}<button data-pg="next" ${page===pages?'disabled':''}>Suiv. ›</button></div></nav>`;
}
function emptyHTML(icon,title,text,action=''){ return `<div class="empty">${svg(icon)}<h4>${esc(title)}</h4><p>${esc(text)}</p>${action?`<div style="margin-top:16px">${action}</div>`:''}</div>`; }

/* ============================================================
   MODULE 6 — LISTE DOCUMENTAIRE RÉUTILISABLE
   Tableau triable ou grille de cartes, filtres combinables, pagination,
   cases à cocher pour les actions groupées, glisser-déposer vers un dossier.
   Utilisée par toutes les rubriques (catégories, favoris, archives,
   corbeille, résultats de recherche, contenu d'un dossier…).
   ============================================================ */
const SORTS={
  title:d=>norm(d.title), category:d=>norm(catLabel(d.category)), type:d=>norm(d.docType||extOf(d.fileName)),
  reference:d=>norm(d.reference), party:d=>norm(d.party), createdAt:d=>d.createdAt, updatedAt:d=>d.updatedAt,
  dueDate:d=>d.dueDate||'9999', fileSize:d=>d.fileSize||0, status:d=>norm(docStatus(d).label),
  amount:d=>{const a=docAmount(d);return a?a.v:-Infinity;}, lastViewedAt:d=>d.lastViewedAt||0, trashedAt:d=>d.trashedAt||0, archivedAt:d=>d.archivedAt||0
};
function sortDocs(arr,key,dir){ const f=SORTS[key]||SORTS.createdAt; const m=dir==='asc'?1:-1;
  return arr.slice().sort((a,b)=>{ const x=f(a),y=f(b); return (x<y?-1:x>y?1:0)*m || (b.createdAt-a.createdAt); }); }
/* Doublons : documents partageant la même empreinte de fichier */
function duplicateGroups(scope=liveDocs()){ const m=new Map(); scope.forEach(d=>{ if(d.fileHash){ if(!m.has(d.fileHash)) m.set(d.fileHash,[]); m.get(d.fileHash).push(d); } }); return [...m.values()].filter(g=>g.length>1); }
function isDuplicate(d){ return !!d.fileHash&&liveDocs().some(x=>x.id!==d.id&&x.fileHash===d.fileHash); }

/* Texte indexé pour la recherche locale (métadonnées réelles uniquement) */
function docSearchText(d){
  const parts=[d.title,d.fileName,d.reference,d.party,d.docType,catLabel(d.category),docStatus(d).label,(d.tags||[]).join(' '),d.notes,d.issueDate,d.dueDate,fmtDate(d.issueDate),fmtDate(d.dueDate),folderPathLabel(d.folderId)];
  if(d.invoice) parts.push(d.invoice.issuer,d.invoice.recipient,d.invoice.number);
  if(d.contract) parts.push(d.contract.counterparty,d.contract.number,(CONTRACT_KINDS.find(k=>k[0]===d.contract.kind)||[])[1]);
  if(d.quote) parts.push(d.quote.client,d.quote.number);
  return norm(parts.filter(Boolean).join(' | '));
}
function highlight(text,q){ const t=esc(text); if(!q) return t; const words=norm(q).split(/\s+/).filter(w=>w.length>1&&!w.includes(':')); if(!words.length) return t;
  // Surlignage insensible aux accents : on repère les positions dans la version normalisée
  const n=norm(text); const marks=[]; words.forEach(w=>{ let i=0; while((i=n.indexOf(w,i))>=0){ marks.push([i,i+w.length]); i+=w.length; } });
  if(!marks.length) return t; marks.sort((a,b)=>a[0]-b[0]); let out='',p=0; marks.forEach(([a,b])=>{ if(a<p) return; out+=esc(text.slice(p,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'; p=b; }); return out+esc(text.slice(p)); }

/* ---------- Composant liste ---------- */
function renderDocList(host,opt){
  const o=Object.assign({key:'default',source:()=>activeDocs(),context:'normal',filters:true,defaultSort:{key:'createdAt',dir:'desc'},emptyIcon:'files',emptyTitle:'Aucun document',emptyText:'Ajoutez votre premier document pour commencer.',emptyAction:'',showFolder:false,q:'' ,catFilter:true,extraCols:null,highlightQ:''},opt);
  const st=vstate('list:'+o.key,{q:'',cat:'',status:'',conf:'',tag:'',party:'',flag:'',sort:o.defaultSort,page:1,sel:[],view:null});
  st.sel=Array.isArray(st.sel)?st.sel:[];
  const viewMode=()=>st.view||PREFS.view||'list';
  host.innerHTML=`${o.filters?`<div class="tbl-tools" role="search" aria-label="Filtrer les documents">
      <div class="search" style="max-width:280px">${svg('search')}<input id="flQ" type="search" placeholder="Filtrer cette liste…" aria-label="Filtrer cette liste" value="${esc(st.q)}"></div>
      ${o.catFilter?`<select class="sel" id="flCat" style="width:auto" aria-label="Catégorie"><option value="">Toutes catégories</option>${cats().map(c=>`<option value="${esc(c.key)}" ${st.cat===c.key?'selected':''}>${esc(c.label)}</option>`).join('')}</select>`:''}
      <select class="sel" id="flStatus" style="width:auto" aria-label="Statut"></select>
      <select class="sel" id="flTag" style="width:auto" aria-label="Mot-clé"></select>
      <select class="sel" id="flFlag" style="width:auto" aria-label="Filtre rapide">
        <option value="">Tous</option><option value="attention" ${st.flag==='attention'?'selected':''}>À compléter / à traiter</option>
        <option value="due" ${st.flag==='due'?'selected':''}>Avec échéance</option><option value="nofile" ${st.flag==='nofile'?'selected':''}>Sans fichier</option>
        <option value="dup" ${st.flag==='dup'?'selected':''}>Doublons</option><option value="fav" ${st.flag==='fav'?'selected':''}>Favoris</option>
        <option value="secret" ${st.flag==='secret'?'selected':''}>Confidentiels</option><option value="demo" ${st.flag==='demo'?'selected':''}>Données de démonstration</option></select>
      <div class="grow"></div>
      <div class="seg" role="group" aria-label="Présentation"><button id="vmList" class="${viewMode()==='list'?'on':''}" aria-pressed="${viewMode()==='list'}" title="Affichage en liste">${svg('list','')}<span class="sr-only">Liste</span></button><button id="vmGrid" class="${viewMode()==='grid'?'on':''}" aria-pressed="${viewMode()==='grid'}" title="Affichage en grille">${svg('grid','')}<span class="sr-only">Grille</span></button></div>
    </div>`:''}
    <div class="bulk-host"></div><div class="list-body"></div>`;
  $$('.seg button svg',host).forEach(s=>{s.style.width='16px';s.style.height='16px';s.style.verticalAlign='-3px';});

  const filtered=()=>{
    let arr=o.source();
    const q=norm(st.q).trim();
    if(q) arr=arr.filter(d=>{ const t=docSearchText(d); return q.split(/\s+/).every(w=>t.includes(w)); });
    if(st.cat) arr=arr.filter(d=>d.category===st.cat);
    if(st.status) arr=arr.filter(d=>docStatus(d).label===st.status);
    if(st.tag) arr=arr.filter(d=>(d.tags||[]).includes(st.tag));
    if(st.flag==='attention') arr=arr.filter(needsAttention);
    if(st.flag==='due') arr=arr.filter(d=>d.dueDate);
    if(st.flag==='nofile') arr=arr.filter(d=>!d.fileId);
    if(st.flag==='dup') arr=arr.filter(isDuplicate);
    if(st.flag==='fav') arr=arr.filter(d=>d.favorite);
    if(st.flag==='secret') arr=arr.filter(d=>d.confidentiality==='confidentiel'||d.confidentiality==='secret');
    if(st.flag==='demo') arr=arr.filter(d=>d.demo);
    return sortDocs(arr,st.sort.key,st.sort.dir);
  };
  const fillSelects=()=>{
    if(!o.filters) return; const base=o.source();
    const stat=[...new Set(base.map(d=>docStatus(d).label))].sort((a,b)=>a.localeCompare(b,'fr'));
    $('#flStatus',host).innerHTML=`<option value="">Tous statuts</option>`+stat.map(s=>`<option ${st.status===s?'selected':''}>${esc(s)}</option>`).join('');
    const tags=[...new Set(base.flatMap(d=>d.tags||[]))].sort((a,b)=>a.localeCompare(b,'fr'));
    $('#flTag',host).innerHTML=`<option value="">Tous mots-clés</option>`+tags.map(s=>`<option ${st.tag===s?'selected':''}>${esc(s)}</option>`).join('');
  };
  const PER=PREFS.perPage||25;
  const draw=()=>{
    const rows=filtered(); const ids=new Set(rows.map(d=>d.id));
    st.sel=st.sel.filter(id=>docById(id)&&ids.has(id));
    const total=rows.length, pages=Math.max(1,Math.ceil(total/PER)); st.page=clamp(st.page,1,pages);
    const start=(st.page-1)*PER, pageRows=rows.slice(start,start+PER);
    const body=$('.list-body',host);
    if(!total){ body.innerHTML=o.source().length&&(st.q||st.cat||st.status||st.tag||st.flag)?emptyHTML('filter','Aucun résultat','Aucun document ne correspond à ces filtres.',`<button class="btn" id="flReset">${svg('x')} Effacer les filtres</button>`):emptyHTML(o.emptyIcon,o.emptyTitle,o.emptyText,o.emptyAction);
      const r=$('#flReset',body); if(r) r.onclick=()=>{ Object.assign(st,{q:'',cat:'',status:'',tag:'',flag:'',page:1}); renderDocList(host,opt); };
      if(o.onEmpty) o.onEmpty(body); drawBulk(); return; }
    const hq=o.highlightQ||st.q;
    if(viewMode()==='grid'){
      body.innerHTML=`<div class="row" style="margin-bottom:12px"><label class="row" style="gap:8px;cursor:pointer;font-size:.84rem;font-weight:700"><input type="checkbox" class="cbx" id="selPage" ${pageRows.length&&pageRows.every(d=>st.sel.includes(d.id))?'checked':''}> Sélectionner la page</label></div>
      <div class="doc-grid">${pageRows.map(d=>docCard(d,st.sel.includes(d.id),hq)).join('')}</div>${pagerHTML(st.page,pages,total,start,pageRows.length)}`;
    } else {
      const th=(k,l,cls='')=>{ const on=st.sort.key===k; return `<th class="${cls}" ${on?`aria-sort="${st.sort.dir==='asc'?'ascending':'descending'}"`:''}><button class="sort" data-sort="${k}">${l}<span class="ar" aria-hidden="true">${on?(st.sort.dir==='asc'?'▲':'▼'):'↕'}</span></button></th>`; };
      body.innerHTML=`<div class="tbl-wrap"><table class="tbl" aria-label="Liste des documents"><thead><tr>
        <th class="chk-col"><input type="checkbox" class="cbx" id="selPage" aria-label="Sélectionner tous les documents de la page" ${pageRows.length&&pageRows.every(d=>st.sel.includes(d.id))?'checked':''}></th>
        ${th('title','Document')}${th('type','Type','col-opt2')}${th('category','Catégorie','col-opt')}${th('reference','Référence','col-opt')}${th('party','Tiers')}
        ${th(o.context==='trash'?'trashedAt':o.context==='recent'?'lastViewedAt':'createdAt',o.context==='trash'?'Supprimé le':o.context==='recent'?'Consulté':'Ajouté le','col-opt')}${th('dueDate','Échéance')}${th('fileSize','Taille','col-opt2')}${th('status','Statut')}
        <th class="tr">Actions</th></tr></thead><tbody>
        ${pageRows.map(d=>docRow(d,st.sel.includes(d.id),o.context,hq)).join('')}</tbody></table></div>${pagerHTML(st.page,pages,total,start,pageRows.length)}`;
    }
    bindBody(body,pageRows); drawBulk();
  };
  /* --- interactions de la liste --- */
  const toggleSel=(id,on)=>{ const i=st.sel.indexOf(id); if(on&&i<0) st.sel.push(id); if(!on&&i>=0) st.sel.splice(i,1); };
  const bindBody=(body,pageRows)=>{
    $$('[data-sort]',body).forEach(b=>b.onclick=()=>{ const k=b.dataset.sort; st.sort={key:k,dir:st.sort.key===k&&st.sort.dir==='asc'?'desc':'asc'}; if(st.sort.key!==k) st.sort.dir='asc'; draw(); const nb=$(`[data-sort="${k}"]`,body); if(nb) nb.focus(); });
    const sp=$('#selPage',body); if(sp) sp.onchange=()=>{ pageRows.forEach(d=>toggleSel(d.id,sp.checked)); draw(); $('#selPage',body)?.focus(); };
    $$('.pager button[data-pg]',body).forEach(b=>b.onclick=()=>{ const v=b.dataset.pg; if(v==='prev') st.page--; else if(v==='next') st.page++; else st.page=+v; draw(); $('#main').scrollTop=0; });
    $$('[data-doc]',body).forEach(el=>{
      const id=el.dataset.doc;
      el.onclick=e=>{ if(e.target.closest('[data-stop]')) return; openDocDrawer(id); };
      el.onkeydown=e=>{ if(e.target!==el) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDocDrawer(id); } };
      el.draggable=true;
      el.ondragstart=e=>{ const list=st.sel.includes(id)?st.sel.slice():[id]; e.dataTransfer.setData('text/odm-docs',JSON.stringify(list)); e.dataTransfer.effectAllowed='move'; el.classList.add('dragging'); };
      el.ondragend=()=>el.classList.remove('dragging');
    });
    $$('input[data-sel]',body).forEach(c=>c.onchange=()=>{ toggleSel(c.dataset.sel,c.checked); const r=c.closest('[data-doc]'); if(r) r.classList.toggle('sel',c.checked); drawBulk(); const sp2=$('#selPage',body); if(sp2) sp2.checked=pageRows.every(d=>st.sel.includes(d.id)); });
    $$('[data-act]',body).forEach(b=>b.onclick=e=>{ e.stopPropagation(); docQuickAction(b.dataset.act,b.dataset.id,b,()=>{ fillSelects(); draw(); }); });
  };

      :t==='archive'?`<button class="btn sm" data-bulk="unarchive">${svg('restore')} Désarchiver</button><button class="btn sm" data-bulk="zip">${svg('zip')} Exporter (ZIP)</button><button class="btn sm danger" data-bulk="trash">${svg('trash')} Corbeille</button>`

      <button class="btn sm ghost" data-bulk="none" style="margin-left:auto">${svg('x')} Désélectionner</button></div>`;
    $$('[data-bulk]',bh).forEach(b=>b.onclick=()=>bulkAction(b.dataset.bulk,st.sel.slice(),()=>{ if(b.dataset.bulk!=='zip') st.sel=[]; fillSelects(); draw(); refreshShellBadges(); }));
  };

    const qi=$('#flQ',host); qi.oninput=debounce(()=>{ st.q=qi.value; st.page=1; draw(); },160);
    if($('#flCat',host)) $('#flCat',host).onchange=e=>{ st.cat=e.target.value; st.page=1; draw(); };
    $('#flStatus',host).onchange=e=>{ st.status=e.target.value; st.page=1; draw(); };
    $('#flTag',host).onchange=e=>{ st.tag=e.target.value; st.page=1; draw(); };
    $('#flFlag',host).onchange=e=>{ st.flag=e.target.value; st.page=1; draw(); };
    $('#vmList',host).onclick=()=>{ st.view='list'; renderDocList(host,opt); };
    $('#vmGrid',host).onclick=()=>{ st.view='grid'; renderDocList(host,opt); };
    fillSelects();
  }
  draw();
  return {redraw:()=>{ fillSelects(); draw(); },state:st};
}

/* ---------- Cellule d'échéance ---------- */
function dueHTML(d){
  if(!d.dueDate) return '<span class="muted">—</span>';
  const n=daysUntil(d.dueDate), s=docStatus(d);
  const closed=['payee','annulee','archivee','resilie','archive','accepte','refuse','commande','archived','trash'].includes(s.key);
  const cls=closed?'':n<0?'dng':n<=7?'warn':n<=30?'info':'';
  return `<span class="nowrap">${fmtDate(d.dueDate)}</span>${cls?`<br><span class="chip ${cls}" style="margin-top:3px">${relDays(n)}</span>`:''}`;
}
function statusChip(d){ const s=docStatus(d); return `<span class="chip ${s.cls}">${esc(s.label)}</span>`; }

function afterChange(){ refreshShellBadges(); if(DRAWER_DOC&&docById(DRAWER_DOC)) openDocDrawer(DRAWER_DOC,{keepTab:true,silent:true}); else if(DRAWER_DOC) closeDrawer(); }

async function toggleFavorite(id){ const d=docById(id); if(!d) return; d.favorite=!d.favorite; await saveDoc(d,{action:d.favorite?'Ajouté aux favoris':'Retiré des favoris',log:false}); toast(d.favorite?'Ajouté aux favoris':'Retiré des favoris','ok'); }
async function archiveDocs(ids,on=true){ const list=ids.map(docById).filter(Boolean); list.forEach(d=>{ d.archived=on; d.archivedAt=on?Date.now():null; }); await saveDocs(list,{action:on?'a archivé':'a restauré depuis les archives'}); toast(on?`${plural(list.length,'document archivé','documents archivés')}`:`${plural(list.length,'document restauré','documents restaurés')} depuis les archives`,'ok'); }
async function trashDocs(ids){ const list=ids.map(docById).filter(Boolean); list.forEach(d=>{ d.trashed=true; d.trashedAt=Date.now(); d.favorite=d.favorite; }); await saveDocs(list,{action:'a placé dans la corbeille'}); toast(`${plural(list.length,'document placé','documents placés')} dans la corbeille`,'warn'); }
async function restoreDocs(ids){ const list=ids.map(docById).filter(Boolean); list.forEach(d=>{ d.trashed=false; d.trashedAt=null; if(d.folderId&&!folderById(d.folderId)) d.folderId=null; }); await saveDocs(list,{action:'a restauré depuis la corbeille'}); toast(`${plural(list.length,'document restauré','documents restaurés')}`,'ok'); }

async function bulkAction(kind,ids,done){
  if(!ids.length) return;
  if(kind==='none') return done();
  if(kind==='move') return moveDialog(ids,done);
  if(kind==='cat') return categoryDialog(ids,done);
  if(kind==='tags') return tagsDialog(ids,done);
  if(kind==='zip') return exportSelectionZip(ids);
  if(kind==='purge') return purgeConfirm(ids,done);
  try{
    if(kind==='fav'){ const list=ids.map(docById).filter(Boolean); const on=!list.every(d=>d.favorite); list.forEach(d=>d.favorite=on); await saveDocs(list,{action:on?'Ajouté aux favoris':'Retiré des favoris'}); toast(on?'Ajoutés aux favoris':'Retirés des favoris','ok'); }
    if(kind==='archive') await archiveDocs(ids,true);
    if(kind==='unarchive') await archiveDocs(ids,false);
    if(kind==='trash') await trashDocs(ids);
    if(kind==='restore') await restoreDocs(ids);
  }catch(e){ toast(storageErrorMessage(e),'dng',7000); }
  done(); afterChange();
}

/* ---------- Actions rapides depuis une ligne / carte ---------- */
async function docQuickAction(act,id,btn,done){
  const d=docById(id); if(!d) return;
  try{
    if(act==='fav'){ await toggleFavorite(id); done(); afterChange(); }
    else if(act==='preview') previewDoc(id);
    else if(act==='download') downloadDoc(id);
    else if(act==='restore'){ await restoreDocs([id]); done(); afterChange(); }
    else if(act==='purge') purgeConfirm([id],done);
    else if(act==='menu') docContextMenu(d,btn,done);
  }catch(e){ toast(storageErrorMessage(e),'dng',7000); }
}
/* Petit menu contextuel (Plus d'actions) */
function docContextMenu(d,btn,done){
  document.querySelectorAll('.ctx-menu').forEach(x=>x.remove());
  const m=document.createElement('div'); m.className='dropdown menu ctx-menu'; m.setAttribute('role','menu');
  const items=[
    ['open','eye','Ouvrir la fiche'],['edit','edit','Modifier les informations'],['rename','edit','Renommer'],['move','move','Déplacer'],
    ['dup','copy','Dupliquer'],d.fileId?['tab','ext','Ouvrir dans un nouvel onglet']:null,
    ['sep'],d.archived?['unarchive','restore','Désarchiver']:['archive','archive','Archiver'],['trash','trash','Placer dans la corbeille','dng']
  ].filter(Boolean);
  m.innerHTML=items.map(i=>i[0]==='sep'?'<div class="menu-sep"></div>':`<button class="menu-item ${i[3]||''}" role="menuitem" data-m="${i[0]}">${svg(i[1])}${esc(i[2])}</button>`).join('');
  document.body.appendChild(m);
  const r=btn.getBoundingClientRect(); m.style.position='fixed'; m.style.width='250px';
  const top=Math.min(r.bottom+6,window.innerHeight-m.offsetHeight-10); m.style.top=Math.max(10,top)+'px'; m.style.left=Math.max(10,Math.min(r.right-250,window.innerWidth-260))+'px'; m.style.right='auto';
  const close=()=>{ m.remove(); document.removeEventListener('click',outside,true); document.removeEventListener('keydown',key,true); };
  const outside=e=>{ if(!m.contains(e.target)) close(); };
  const key=e=>{ const its=$$('.menu-item',m); const i=its.indexOf(document.activeElement);
    if(e.key==='Escape'){ e.stopPropagation(); close(); btn.focus(); } else if(e.key==='ArrowDown'){ e.preventDefault(); its[(i+1)%its.length].focus(); } else if(e.key==='ArrowUp'){ e.preventDefault(); its[(i-1+its.length)%its.length].focus(); } else if(e.key==='Tab'){ close(); } };
  setTimeout(()=>{ document.addEventListener('click',outside,true); document.addEventListener('keydown',key,true); $('.menu-item',m).focus(); },0);
  $$('[data-m]',m).forEach(b=>b.onclick=async()=>{ close(); const a=b.dataset.m;
    try{
      if(a==='open') openDocDrawer(d.id);
      if(a==='edit') docForm({id:d.id});
      if(a==='rename') renameDoc(d.id);
      if(a==='move') moveDialog([d.id],done);
      if(a==='dup') duplicateDialog(d.id);
      if(a==='tab') openDocInTab(d.id);
      if(a==='archive'||a==='unarchive'){ await archiveDocs([d.id],a==='archive'); done(); afterChange(); }
      if(a==='trash'){ await trashDocs([d.id]); done(); afterChange(); }
    }catch(e){ toast(storageErrorMessage(e),'dng',7000); }
  });
}
function renameDoc(id){ const d=docById(id); promptDialog({title:'Renommer le document',label:'Nom du document',value:d.title,onSubmit:async v=>{ const old=d.title; d.title=v.slice(0,200); await saveDoc(d,{action:'a renommé',detail:`« ${old} » → « ${d.title} »`}); toast('Document renommé','ok'); rerender(); afterChange(); }}); }
function duplicateDialog(id){

  openModal({title:'Dupliquer le document',body:`<p class="soft" style="margin-bottom:14px">Choisissez le type de duplication pour « ${esc(d.title)} » :</p>

async function duplicateDoc(id,full){
  const d=docById(id); const n=structuredClone(d); const now=Date.now();
  Object.assign(n,{id:uid('doc'),title:d.title+' (copie)',createdAt:now,updatedAt:now,lastViewedAt:null,favorite:false,history:[],demo:false,archived:false,trashed:false,archivedAt:null,trashedAt:null});
  if(n.quote) n.quote.links={contractId:null,orderId:null,invoiceId:null};
  if(n.invoice) n.invoice.payments=[];
  n.sourceQuoteId=null;
  if(full&&d.fileId){ const f=await getFileRec(d.fileId); if(!f) throw new Error('Fichier original introuvable.');
    const fid=uid('file'); await IDB.put('files',{id:fid,blob:f.blob,name:f.name,type:f.type,size:f.size,hash:f.hash,createdAt:now}); n.fileId=fid; }
  else { Object.assign(n,{fileId:null,fileName:'',fileType:'',fileSize:0,fileHash:'',hashAlgo:'',thumb:null,contentText:''}); }
  await saveDoc(n,{action:full?'Copie complète créée':'Métadonnées dupliquées',detail:'depuis « '+d.title+' »'});
  return n;
}

/* ---------- Fichier : téléchargement, onglet, prévisualisation ---------- */
async function markViewed(d){ d.lastViewedAt=Date.now(); await IDB.put('docs',d); S.docs.set(d.id,d); }
async function downloadDoc(id){
  const d=docById(id); const f=await getFileRec(d&&d.fileId); if(!f){ toast('Aucun fichier original associé à ce document.','warn'); return; }
  downloadBlob(f.blob,d.fileName||f.name||d.title); d.history=d.history||[]; await saveDoc(d,{action:'Téléchargé',log:false,touch:false}); toast('Téléchargement lancé','ok');
}
async function openDocInTab(id){
  const d=docById(id); const f=await getFileRec(d&&d.fileId); if(!f){ toast('Aucun fichier original associé.','warn'); return; }
  const blob=f.blob.type?f.blob:new Blob([f.blob],{type:mimeOf(d.fileName,'')});
  const u=blobURL(blob,'tab'); const w=window.open(u,'_blank','noopener');
  if(!w) toast("Le navigateur a bloqué l'ouverture d'un nouvel onglet. Autorisez les fenêtres pop-up ou utilisez Télécharger.",'warn',7000);
  setTimeout(()=>revokeURL(u),120000); // libération après 2 min (le temps que l'onglet charge le fichier)
  await markViewed(d);
}
/* Prévisualisation native : PDF (lecteur intégré du navigateur), images, texte, CSV.
   Les autres formats ne sont pas interprétés : aucune fausse vignette. */
async function previewDoc(id){
  const d=docById(id); if(!d) return;
  if(!d.fileId){ toast('Ce document ne contient pas de fichier à prévisualiser.','info'); return; }
  const f=await getFileRec(d.fileId); if(!f){ toast('Fichier original introuvable dans la base locale.','dng'); return; }
  await markViewed(d); d.history.unshift({at:Date.now(),action:'Consulté',detail:''}); d.history=d.history.slice(0,120); await IDB.put('docs',d);
  const fam=fileFamily(d.fileName,f.type), e=extOf(d.fileName);
  const type=mimeOf(d.fileName,f.blob.type||f.type);
  const blob=f.blob.type===type?f.blob:new Blob([f.blob],{type});
  let body='', url=null;
  if(e==='pdf'){ url=blobURL(blob,'preview'); body=`<iframe class="pv-frame" src="${url}#toolbar=1&view=FitH" title="Aperçu PDF : ${esc(d.title)}"></iframe>`; }
  else if(fam==='img'&&/^image\/(png|jpe?g|webp|gif|bmp)$/.test(type)){ url=blobURL(blob,'preview'); body=`<div class="pv-img"><img src="${url}" alt="Aperçu de ${esc(d.title)}" id="pvImg" title="Cliquer pour zoomer"></div>`; }
  else if(['txt','md','json','xml'].includes(e)&&f.size<3*1024*1024){ const t=await f.blob.text(); body=`<pre class="pv-text" tabindex="0">${esc(t)}</pre>`; }
  else if(e==='csv'&&f.size<3*1024*1024){ const t=await f.blob.text(); body=`<div class="pv-csv" tabindex="0">${csvTableHTML(t)}</div>`; }
  else body=`<div class="pv-none"><div>${fileIconHTML(Object.assign({},d,{thumb:null}))}<h4 class="serif" style="font-size:1.2rem;margin-bottom:8px">Aperçu non disponible pour ce format</h4>
    <p class="muted" style="max-width:460px;margin:0 auto 16px">Le navigateur ne sait pas afficher les fichiers <b>.${esc(e.toUpperCase())}</b> (${esc(fmtSize(f.size))}). Téléchargez-le pour l'ouvrir avec le logiciel adapté (Word, Excel, LibreOffice…). Le fichier original est conservé intact.</p>
    <button class="btn gold" id="pvDl2">${svg('down')} Télécharger le fichier</button></div></div>`;
  openModal({title:d.title,size:'xl',body,
    footer:`<span class="muted small" style="margin-right:auto">${esc(d.fileName)} · ${fmtSize(f.size)}</span>
      <button class="btn ghost" id="pvTab">${svg('ext')} Nouvel onglet</button><button class="btn" id="pvDl">${svg('down')} Télécharger</button><button class="btn gold" data-close>Fermer</button>`,
    onOpen:m=>{ $('#pvDl',m).onclick=()=>downloadDoc(id); $('#pvTab',m).onclick=()=>openDocInTab(id); const d2=$('#pvDl2',m); if(d2) d2.onclick=()=>downloadDoc(id);
      const im=$('#pvImg',m); if(im) im.onclick=()=>im.classList.toggle('zoomed'); },
    onClose:()=>revokeTag('preview')});
}
function parseCSV(t){ const rows=[]; let row=[],cell='',q=false; const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
  for(let i=0;i<t.length;i++){ const c=t[i]; if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===sep){ row.push(cell); cell=''; } else if(c==='\n'){ row.push(cell.replace(/\r$/,'')); rows.push(row); row=[]; cell=''; } else cell+=c; if(rows.length>500) break; }
  if(cell||row.length){ row.push(cell); rows.push(row); } return rows; }
function csvTableHTML(t){ const r=parseCSV(t); if(!r.length) return '<p class="muted" style="padding:20px">Fichier CSV vide.</p>';
  return `<table class="tbl"><thead><tr>${r[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.slice(1).map(x=>`<tr style="cursor:default">${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${r.length>500?'<p class="muted small" style="padding:12px">Aperçu limité aux 500 premières lignes.</p>':''}`; }

/* ============================================================
   MODULE 8 — IMPORTATION & FORMULAIRE DOCUMENT
   • import d'un ou plusieurs fichiers (sélecteur ou glisser-déposer)
   • empreinte SHA-256 + détection des doublons AVANT enregistrement
   • progression réelle (lecture → empreinte → enregistrement)
   • fichier original stocké tel quel (Blob) dans IndexedDB
   • champs spécifiques contrat / facture / devis

const BUSINESS_CATS=['contrat','facture','devis'];
function ensureBusinessBlock(d){
  if(d.category==='contrat'&&!d.contract) d.contract=blankContract();
  if(d.category==='facture'&&!d.invoice) d.invoice=blankInvoice();
  if(d.category==='devis'&&!d.quote) d.quote=blankQuote();
  return d;
}
const knownParties = ()=>[...new Set(liveDocs().flatMap(d=>[d.party,d.invoice&&d.invoice.issuer,d.invoice&&d.invoice.recipient,d.contract&&d.contract.counterparty,d.quote&&d.quote.client]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));

const amt=v=>v===null||v===undefined?'':String(v).replace('.',',');

      <div class="field"><label for="c_period">Périodicité</label><select class="sel" id="c_period">${[['total','Montant total'],['mensuel','Par mois'],['trimestriel','Par trimestre'],['annuel','Par an']].map(p=>opt(p[0],p[1],c.amountPeriod)).join('')}</select></div>

    <div class="calc-box" id="c_calc" aria-live="polite"></div>

  <fieldset class="fieldset hide" id="dfInvoice"><legend>Facture</legend>
    <div class="grid-2">

      <div class="field"><label for="i_number">N° de facture</label><input class="inp mono" id="i_number" value="${esc(i.number)}"></div>

    <div class="grid-3">
      <div class="field"><label for="q_ht">Montant HT</label><input class="inp mono" inputmode="decimal" id="q_ht" value="${amt(q.ht)}"></div>
      <div class="field"><label for="q_tva">TVA</label><input class="inp mono" inputmode="decimal" id="q_tva" value="${amt(q.tva)}"></div>
      <div class="field"><label for="q_ttc">Montant TTC</label><input class="inp mono" inputmode="decimal" id="q_ttc" value="${amt(q.ttc)}" placeholder="calculé si vide"></div>
    </div>
    <div class="field" style="max-width:200px"><label for="q_cur">Devise</label><select class="sel" id="q_cur">${['EUR','CHF','USD','GBP','CAD'].map(x=>opt(x,x,q.currency)).join('')}</select></div>
    <div class="calc-box" id="q_calc" aria-live="polite"></div>
  </fieldset>

  <fieldset class="fieldset"><legend>Mots-clés, notes & rappel</legend>
    <div class="field"><label for="dfTags">Mots-clés</label><input class="inp" id="dfTags" list="tagSuggest" value="${esc((d.tags||[]).join(', '))}" placeholder="séparés par des virgules"></div>
    <div class="field"><label for="dfNotes">Notes internes / commentaires</label><textarea class="inp" id="dfNotes" maxlength="5000">${esc(d.notes)}</textarea></div>
    <div class="field" style="max-width:320px"><label for="dfRemind">Rappel personnalisé (jours avant l'échéance)</label><input class="inp" type="number" min="0" max="730" id="dfRemind" value="${d.reminderDays??''}" placeholder="par défaut : réglage de la catégorie"></div>

  <datalist id="dfParties">${knownParties().map(p=>`<option value="${esc(p)}">`).join('')}</datalist>${tagDatalist()}

  openModal({title:edit?'Modifier le document':'Ajouter des documents',size:'wide',body,
    footer:`<span class="muted small" id="dfSummary" style="margin-right:auto"></span><button class="btn ghost" data-close>Annuler</button><button class="btn gold" id="dfSave">${svg('save')} ${edit?'Enregistrer':'Enregistrer'}</button>`,
    onOpen:m=>{
      const cat=$('#dfCat',m);
      const syncCat=()=>{ const k=cat.value;
        $('#dfContract',m).classList.toggle('hide',k!=='contrat'); $('#dfInvoice',m).classList.toggle('hide',k!=='facture'); $('#dfQuote',m).classList.toggle('hide',k!=='devis');
        $('#dfGeneric',m).classList.toggle('hide',BUSINESS_CATS.includes(k)); $('#dfStatusWrap',m).classList.toggle('hide',BUSINESS_CATS.includes(k));
        if(!folderTouched){ const f=S.settings.defaultFolders[k]; $('#dfFolder',m).value=f&&folderById(f)?f:(preset.folderId||''); }
        recalc(); };
      cat.onchange=syncCat; $('#dfFolder',m).onchange=()=>folderTouched=true;
      /* Calculs en direct (TTC, cohérence, préavis) */
      const recalc=()=>{
        const k=cat.value;
        if(k==='facture'){ const tmp={ht:parseAmount($('#i_ht',m).value),tva:parseAmount($('#i_tva',m).value),ttc:parseAmount($('#i_ttc',m).value),payments:(d.invoice&&d.invoice.payments)||[]};
          const a=invoiceAmounts(tmp), cur=$('#i_cur',m).value; let h='';
          if(a.ttc!==null) h+=`<span class="chip gold">TTC : ${esc(fmtMoney(a.ttc,cur))}</span>`;
          if(a.tva!==null&&tmp.tva===null) h+=`<span class="chip">TVA déduite : ${esc(fmtMoney(a.tva,cur))}</span>`;
          if(!a.coherent) h+=`<span class="chip dng">${svg('warn')} HT + TVA (${esc(fmtMoney(round2(tmp.ht+tmp.tva),cur))}) ≠ TTC</span>`;
          if(a.paid) h+=`<span class="chip ok">Déjà réglé : ${esc(fmtMoney(a.paid,cur))}</span><span class="chip">Solde : ${esc(fmtMoney(a.balance,cur))}</span>`;
          $('#i_calc',m).innerHTML=h; }
        if(k==='devis'){ const tmp={ht:parseAmount($('#q_ht',m).value),tva:parseAmount($('#q_tva',m).value),ttc:parseAmount($('#q_ttc',m).value)}; const a=invoiceAmounts(tmp), cur=$('#q_cur',m).value;
          $('#q_calc',m).innerHTML=(a.ttc!==null?`<span class="chip gold">TTC : ${esc(fmtMoney(a.ttc,cur))}</span>`:'')+(!a.coherent?`<span class="chip dng">${svg('warn')} HT + TVA ≠ TTC</span>`:'')+($('#q_valid',m).value?`<span class="chip ${daysUntil($('#q_valid',m).value)<0?'warn':'info'}">Validité : ${relDays(daysUntil($('#q_valid',m).value))}</span>`:''); }
        if(k==='contrat'){ const tmp={renewalDate:$('#c_renew',m).value,endDate:$('#c_end',m).value,noticeValue:Number($('#c_notice',m).value)||null,noticeUnit:$('#c_unit',m).value};
          const n=contractNotice(tmp); let h='';
          if(tmp.endDate) h+=`<span class="chip ${daysUntil(tmp.endDate)<0?'dng':'info'}">Fin : ${fmtDate(tmp.endDate)} (${relDays(daysUntil(tmp.endDate))})</span>`;
          if(n) h+=`<span class="chip ${n.days<0?'dng':n.days<=30?'warn':'gold'}">Préavis à notifier avant le ${fmtDate(n.deadline)} (${relDays(n.days)})</span>`;
          else if(tmp.noticeValue) h+=`<span class="chip">Indiquez une date de fin ou de renouvellement pour calculer le préavis</span>`;
          $('#c_calc',m).innerHTML=h; }
      };
      $$('#dfInvoice input,#dfInvoice select,#dfQuote input,#dfQuote select,#dfContract input,#dfContract select',m).forEach(x=>x.addEventListener('input',recalc));
      /* Émetteur / destinataire pré-remplis avec le nom de l'entreprise selon le sens de la facture */
      $('#i_dir',m).addEventListener('change',()=>{ const co=S.settings.company.name; if(!co) return; const dir=$('#i_dir',m).value;
        if(dir==='client'&&!$('#i_issuer',m).value) $('#i_issuer',m).value=co; if(dir==='fournisseur'&&!$('#i_recipient',m).value) $('#i_recipient',m).value=co; });
      if(!edit&&cat.value==='facture') $('#i_dir',m).dispatchEvent(new Event('change'));
      cat.addEventListener('change',()=>{ if(cat.value==='facture') $('#i_dir',m).dispatchEvent(new Event('change')); });
      syncCat();

      /* --- File d'importation --- */
      const drop=$('#dfDrop',m), inp=$('#dfFile',m);
      drop.onclick=()=>inp.click();
      drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); inp.click(); } };
      inp.onchange=()=>{ addFiles([...inp.files]); inp.value=''; };
      ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); e.stopPropagation(); drop.classList.add('over'); }));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); e.stopPropagation(); drop.classList.remove('over'); }));
      drop.addEventListener('drop',e=>addFiles([...(e.dataTransfer.files||[])]));
      const drawQueue=()=>{
        const qh=$('#dfQueue',m); if(!qh) return;
        qh.innerHTML=Q.map((x,k)=>`<div class="q-item ${x.err?'err':x.dup?'dup':''}" data-k="${k}">
          ${fileIconHTML({fileId:1,fileName:x.file.name,fileType:x.file.type,category:cat.value})}
          <div class="info">${Q.length>1&&!edit?`<label class="sr-only" for="qt${k}">Nom du document ${k+1}</label><input class="inp" id="qt${k}" data-qt="${k}" value="${esc(x.title)}" ${x.err?'disabled':''}>`:`<b class="ellipsis" style="display:block">${esc(x.file.name)}</b>`}
            <div class="st">${x.err?`<span class="chip dng">${svg('warn')} ${esc(x.err)}</span>`
              :x.done?`<span class="chip ok">${svg('check')} Enregistré</span>`
              :x.dup?`<span class="chip warn">${svg('copy')} Doublon de « ${esc(x.dup.title)} »</span>
                 <label class="small"><select class="sel" data-keep="${k}" style="padding:4px 30px 4px 8px;font-size:.78rem;width:auto" aria-label="Choix pour le doublon"><option value="skip" ${!x.keep?'selected':''}>Ne pas importer</option><option value="keep" ${x.keep?'selected':''}>Conserver une nouvelle copie</option></select></label>
                 <button type="button" class="btn sm ghost" data-seedup="${esc(x.dup.id)}" style="padding:3px 9px">Voir</button>`
              :`<span class="muted">${fmtSize(x.file.size)} · ${esc(x.stage||'')}</span>`}</div>
            ${!x.err&&!x.done&&x.busy?`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(x.prog*100)}" aria-label="Progression ${esc(x.file.name)}"><span style="width:${Math.round(x.prog*100)}%"></span></div>`:''}
          </div>${!x.done?`<button type="button" class="x-btn" data-rm="${k}" aria-label="Retirer ${esc(x.file.name)} de la liste">${svg('x')}</button>`:''}</div>`).join('');
        $$('[data-qt]',qh).forEach(t=>t.oninput=()=>Q[+t.dataset.qt].title=t.value);
        $$('[data-keep]',qh).forEach(s=>s.onchange=()=>{ Q[+s.dataset.keep].keep=s.value==='keep'; summary(); });
        $$('[data-rm]',qh).forEach(b=>b.onclick=()=>{ Q.splice(+b.dataset.rm,1); drawQueue(); });
        $$('[data-seedup]',qh).forEach(b=>b.onclick=()=>{ closeModal(); openDocDrawer(b.dataset.seedup); });
        $('#dfTitleWrap',m).classList.toggle('hide',!edit&&Q.filter(x=>!x.err).length>1);
        summary();
      };
      const summary=()=>{ const ok=Q.filter(x=>!x.err&&(!x.dup||x.keep)).length, err=Q.filter(x=>x.err).length, dup=Q.filter(x=>x.dup&&!x.keep).length;
        $('#dfSummary',m).textContent=Q.length?`${plural(ok,'fichier prêt','fichiers prêts')}${dup?` · ${plural(dup,'doublon ignoré','doublons ignorés')}`:''}${err?` · ${plural(err,'erreur')}`:''}`:''; };
      let hashing=Promise.resolve();
      const addFiles=files=>{
        if(!files.length) return;
        if(edit){ files=files.slice(0,1); Q.length=0; }
        files.forEach(f=>{ const x={file:f,title:f.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim()||f.name,err:validateFile(f),prog:0,stage:'En attente…',dup:null,keep:false};
          if(!x.err&&f.size>1024*1024*1024) x.stage='Fichier volumineux (> 1 Go) : l\'importation peut être longue';
          Q.push(x); });
        if((edit||Q.filter(x=>!x.err).length===1)&&!$('#dfTitle',m).value.trim()){ const first=Q.find(x=>!x.err); if(first) $('#dfTitle',m).value=first.title; }
        drawQueue();
        // Empreintes calculées une par une (progression réelle de lecture)
        hashing=hashing.then(async()=>{ for(const x of Q){ if(x.err||x.hash||x.hashing) continue; x.hashing=true; x.busy=true; x.stage='Lecture et calcul de l\'empreinte…'; drawQueue();
          try{ let last=0; const r=await hashBlob(x.file,p=>{ x.prog=p*.9; if(Date.now()-last>120){ last=Date.now(); const bar=$(`#dfQueue [data-k="${Q.indexOf(x)}"] .prog span`,m); if(bar) bar.style.width=Math.round(x.prog*100)+'%'; } });
            x.hash=r.hash; x.algo=r.algo; x.prog=.9; x.busy=false; x.stage='Prêt à enregistrer';
            const dup=liveDocs().find(o=>o.fileHash===x.hash&&(!edit||o.id!==d.id)); if(dup) x.dup=dup;
            const dupQ=Q.find(o=>o!==x&&o.hash===x.hash&&!o.err); if(!dup&&dupQ){ x.dup={id:'',title:dupQ.file.name}; }
          }catch(e){ x.err='Lecture impossible : '+(e.message||e); x.busy=false; }
          drawQueue(); } });
      };
      if(preset.files&&preset.files.length) addFiles(preset.files);

      /* --- Enregistrement --- */
      let saving=false;
      $('#dfSave',m).onclick=async()=>{
        if(saving) return;
        const k=cat.value; const title=$('#dfTitle',m).value.trim();
        const valid=Q.filter(x=>!x.err);
        if(!edit&&valid.length<=1&&!title){ $('#dfTitle',m).focus(); toast('Indiquez le nom du document.','warn'); return; }
        if(edit&&!title){ $('#dfTitle',m).focus(); toast('Le nom du document est obligatoire.','warn'); return; }
        if(k==='contrat'&&!$('#c_party',m).value.trim()){ $('#c_party',m).focus(); toast('Indiquez le cocontractant du contrat.','warn'); return; }
        const dates=$$('input[type=date]',m).filter(x=>x.value&&!isValidISO(x.value)); if(dates.length){ dates[0].focus(); toast('Une date est invalide.','warn'); return; }
        if(k==='contrat'&&$('#c_start',m).value&&$('#c_end',m).value&&$('#c_end',m).value<$('#c_start',m).value){ $('#c_end',m).focus(); toast('La date de fin est antérieure à la date de début.','warn'); return; }
        if(k==='facture'){ const ttc=invoiceAmounts({ht:parseAmount($('#i_ht',m).value),tva:parseAmount($('#i_tva',m).value),ttc:parseAmount($('#i_ttc',m).value)}).ttc; if(ttc===null){ $('#i_ttc',m).focus(); toast('Indiquez le montant TTC (ou le montant HT).','warn'); return; } }
        for(const f of ['#i_ht','#i_tva','#i_ttc','#q_ht','#q_tva','#q_ttc','#c_amount']){ const el=$(f,m); if(el&&el.value.trim()&&parseAmount(el.value)===null&&!el.closest('.hide')){ el.focus(); toast('Montant invalide : utilisez des chiffres (ex. 1250,50).','warn'); return; } }
        saving=true; const btn=$('#dfSave',m); btn.disabled=true; btn.innerHTML=`${svg('clock')} Enregistrement…`;
        try{
          await hashing;
          // Construction des métadonnées communes
          const base=d; base.category=k; base.docType=$('#dfType',m).value.trim(); base.folderId=$('#dfFolder',m).value||null;
          base.confidentiality=$('#dfConf',m).value; base.status=BUSINESS_CATS.includes(k)?base.status:$('#dfStatus',m).value;
          base.tags=parseTags($('#dfTags',m).value); base.notes=$('#dfNotes',m).value.trim();
          const rd=$('#dfRemind',m).value; base.reminderDays=rd===''?null:clamp(parseInt(rd,10)||0,0,730);
          if(!BUSINESS_CATS.includes(k)){ base.party=$('#dfParty',m).value.trim(); base.reference=$('#dfRef',m).value.trim(); base.issueDate=$('#dfIssue',m).value; base.dueDate=$('#dfDue',m).value; }
          if(k==='contrat'){ base.contract=Object.assign(base.contract||blankContract(),{kind:$('#c_kind',m).value,status:$('#c_status',m).value,number:$('#c_number',m).value.trim(),counterparty:$('#c_party',m).value.trim(),signDate:$('#c_sign',m).value,startDate:$('#c_start',m).value,endDate:$('#c_end',m).value,renewalDate:$('#c_renew',m).value,noticeValue:$('#c_notice',m).value===''?null:clamp(parseInt($('#c_notice',m).value,10)||0,0,999),noticeUnit:$('#c_unit',m).value,tacitRenewal:$('#c_tacit',m).checked,amount:parseAmount($('#c_amount',m).value),amountPeriod:$('#c_period',m).value,currency:$('#c_cur',m).value}); }
          if(k==='facture'){ const ht=parseAmount($('#i_ht',m).value),tva=parseAmount($('#i_tva',m).value); let ttc=parseAmount($('#i_ttc',m).value); if(ttc===null&&ht!==null) ttc=round2(ht+(tva||0));
            base.invoice=Object.assign(base.invoice||blankInvoice(),{direction:$('#i_dir',m).value,number:$('#i_number',m).value.trim(),issuer:$('#i_issuer',m).value.trim(),recipient:$('#i_recipient',m).value.trim(),issueDate:$('#i_issue',m).value,dueDate:$('#i_due',m).value,ht,tva:tva!==null?tva:(ht!==null&&ttc!==null?round2(ttc-ht):null),ttc,currency:$('#i_cur',m).value,manualStatus:$('#i_manual',m).value||null}); }
          if(k==='devis'){ const ht=parseAmount($('#q_ht',m).value),tva=parseAmount($('#q_tva',m).value); let ttc=parseAmount($('#q_ttc',m).value); if(ttc===null&&ht!==null) ttc=round2(ht+(tva||0));
            base.quote=Object.assign(base.quote||blankQuote(),{number:$('#q_number',m).value.trim(),client:$('#q_client',m).value.trim(),issueDate:$('#q_issue',m).value,validUntil:$('#q_valid',m).value,ht,tva:tva!==null?tva:(ht!==null&&ttc!==null?round2(ttc-ht):null),ttc,currency:$('#q_cur',m).value,status:$('#q_status',m).value}); }
          syncBusinessFields(base);

          if(edit){
            base.title=title.slice(0,200);
            const nf=Q.find(x=>!x.err&&(!x.dup||x.keep));
            const oldFileId=src.fileId;
            if(nf){ nf.stage='Enregistrement du fichier…'; drawQueue(); await storeFileForDoc(base,nf); }
            const changed=describeChanges(src,base);
            base.updatedAt=Date.now(); base.history=base.history||[]; base.history.unshift({at:Date.now(),action:nf?'Fichier remplacé':'Informations modifiées',detail:changed}); base.history=base.history.slice(0,120);
            await IDB.tx(['docs','files'],'readwrite',st=>{ st.docs.put(base); if(nf){ st.files.put(nf._rec); if(oldFileId&&oldFileId!==base.fileId&&!allDocs().some(o=>o.id!==base.id&&o.fileId===oldFileId)) st.files.delete(oldFileId); } });
            S.docs.set(base.id,base); await logActivity(nf?'a remplacé le fichier de':'a modifié',base.title,base.id);
            closeModal(); toast('Document enregistré','ok'); rerender(); afterChange(); return;
          }
          // Création : 1 document par fichier (ou une fiche sans fichier)
          const toSave=Q.filter(x=>!x.err&&(!x.dup||x.keep));
          const created=[]; let failed=0;
          if(!toSave.length){
            if(Q.length&&Q.every(x=>x.err)){ toast('Aucun fichier valide à importer : retirez les fichiers en erreur ou ajoutez-en un autre.','warn',6000); saving=false; btn.disabled=false; btn.innerHTML=`${svg('save')} Enregistrer`; return; }
            if(Q.some(x=>!x.err)&&!toSave.length){ toast('Aucun fichier à importer (doublons ignorés).','warn'); saving=false; btn.disabled=false; btn.innerHTML=`${svg('save')} Enregistrer`; return; }
            const n=structuredClone(base); n.id=uid('doc'); n.title=title.slice(0,200); n.createdAt=n.updatedAt=Date.now();
            n.history=[{at:Date.now(),action:'Fiche créée',detail:'sans fichier original'}];
            await saveDoc(n,{action:'',log:false}); await logActivity('a créé la fiche',n.title,n.id); created.push(n);
          }
          for(const x of toSave){
            const n=structuredClone(base); n.id=uid('doc'); n.createdAt=n.updatedAt=Date.now();
            n.title=(toSave.length===1&&title?title:(x.title||x.file.name)).slice(0,200);
            try{
              x.stage='Enregistrement…'; x.prog=.95; x.busy=true; drawQueue();
              await storeFileForDoc(n,x);
              n.history=[{at:Date.now(),action:'Importé',detail:x.file.name+' ('+fmtSize(x.file.size)+')'}];
              await IDB.tx(['docs','files'],'readwrite',st=>{ st.files.put(x._rec); st.docs.put(n); });
              S.docs.set(n.id,n); x.done=true; x.busy=false; x.prog=1; created.push(n);
              await logActivity('a importé',n.title,n.id);
            }catch(e){ failed++; x.busy=false; x.err=storageErrorMessage(e); x.dup=null; console.error(e); }
            drawQueue();
          }
          refreshShellBadges();
          if(failed){ toast(`${plural(created.length,'document enregistré','documents enregistrés')}, ${plural(failed,'échec')}. Consultez le détail ci-dessus.`,'dng',8000); btn.disabled=false; btn.innerHTML=`${svg('save')} Réessayer`; saving=false; Q.splice(0,Q.length,...Q.filter(x=>!x.done)); drawQueue(); rerender(); return; }
          closeModal(); toast(created.length>1?`${created.length} documents importés`:`Document « ${created[0].title} » enregistré`,'ok'); rerender();
          if(created.length===1&&preset.afterCreate) preset.afterCreate(created[0]);
        }catch(e){ console.error(e); toast(storageErrorMessage(e),'dng',8000); saving=false; btn.disabled=false; btn.innerHTML=`${svg('save')} Réessayer`; }
      };
    }});
}
/* Prépare l'enregistrement du fichier (Blob original intact) et les métadonnées associées */
async function storeFileForDoc(doc,x){
  const f=x.file; const fid=uid('file'); const type=mimeOf(f.name,f.type);
  const blob=f.type?f:new Blob([f],{type});
  x._rec={id:fid,blob,name:f.name,type,size:f.size,hash:x.hash||'',algo:x.algo||'',createdAt:Date.now(),lastModified:f.lastModified||null};
  Object.assign(doc,{fileId:fid,fileName:f.name,fileType:type,fileSize:f.size,fileHash:x.hash||'',hashAlgo:x.algo||''});
  doc.thumb=await makeThumb(blob); doc.contentText=await extractText(blob,f.name);
}
function describeChanges(a,b){
  const L={title:'nom',category:'catégorie',docType:'type',folderId:'dossier',party:'tiers',reference:'référence',issueDate:'date d\'émission',dueDate:'échéance',confidentiality:'confidentialité',status:'statut',notes:'notes',tags:'mots-clés'};
  const ch=Object.keys(L).filter(k=>JSON.stringify(a[k])!==JSON.stringify(b[k])).map(k=>L[k]);
  ['contract','invoice','quote'].forEach(k=>{ if(JSON.stringify(a[k])!==JSON.stringify(b[k])) ch.push({contract:'contrat',invoice:'facture',quote:'devis'}[k]); });
  return ch.length?'Champs modifiés : '+ch.join(', '):'';
}
